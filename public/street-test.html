<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Street test — graphic 3D drawing</title>
<style>
html,body{margin:0;height:100%;background:#8fd9e2;overflow:hidden;font-family:system-ui,sans-serif}
#c{display:block;width:100%;height:100%}
#hint{position:fixed;left:14px;top:12px;color:#22333a;font-size:13px;opacity:.7;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">↑ ↓ walk · ← → step sideways · drag to look</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================================
   STREET TEST v2 — a dense graphic alley in the manner of "Messenger" (abeto).
   Rules: simple geometry, one flat colour per object plus one shadow tone, hard graphic
   shadows, thin dark lines on silhouettes and corners only. No textures, no grain.
   ===================================================================================== */
const PAL={
  sky:0x8fd9e2, cloud:0xe4f3f1, sea:0x56b9c9, seaFar:0x4aa9bb, mountain:0x6f8a99,
  road:0x6d7f8c, roadLine:0xe9ece6, kerb:0xb9bcb4, pavement:0xc9ccc3,
  concrete:0xb9bcb5, concreteLt:0xd3d5cf, beige:0xd9d3c1, beigeLt:0xe9e5d8, offwhite:0xf1f0e8,
  darkHouse:0x5f5b57, slate:0x66757f, seafoam:0x8fcabb, teal:0x5fa79a, orange:0xe38c3a,
  rail:0xe2e3dd, metal:0x8f958f, ink:0x2a3a44, glass:0x33414a, plant:0x6e9e5c, pot:0x9c7f75,
  skin:0xf1d2b6, shirt:0xc0392b, collar:0xf1e9d6, shorts:0x6f6b46, hair:0x1f2226, shoe:0xc0392b, sock:0xf3f1ea
};
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
const DPR=Math.min(devicePixelRatio||1,2);renderer.setPixelRatio(DPR);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.BasicShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(PAL.sky);
const camera=new THREE.PerspectiveCamera(74,1,.1,400);
scene.add(new THREE.AmbientLight(0xffffff,.76));
const sun=new THREE.DirectionalLight(0xfff8ee,.32);sun.position.set(-16,30,-8);sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096);Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:120});sun.shadow.bias=-.0015;scene.add(sun);scene.add(sun.target);
const ramp=(()=>{const d=new Uint8Array([0,0,0,255,255,255,255,255]);const t=new THREE.DataTexture(d,2,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;})();
const matCache=new Map();
function flat(c,ds){const k=c+(ds?'d':'');if(!matCache.has(k)){matCache.set(k,new THREE.MeshToonMaterial({color:c,gradientMap:ramp,side:ds?THREE.DoubleSide:THREE.FrontSide}));}return matCache.get(k);}
const unlit=c=>new THREE.MeshBasicMaterial({color:c});
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function mesh(geo,mat,x=0,y=0,z=0,shadow=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;return m;}
function box(w,h,d,c,x=0,y=0,z=0,ry=0){const m=mesh(new THREE.BoxGeometry(w,h,d),flat(c),x,y,z);m.rotation.y=ry;return m;}
function plane(w,h,c,x,y,z,ry=0,rx=0){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),unlit(c));m.position.set(x,y,z);m.rotation.set(rx,ry,0);m.userData.noInk=true;return m;}
function cyl(r,h,c,x,y,z,seg=8){return mesh(new THREE.CylinderGeometry(r,r,h,seg),flat(c),x,y,z);}
/* ---------- road: narrow, curving, climbing ---------- */
const path=new THREE.CatmullRomCurve3([V(0,3.2,22),V(0.5,2.7,9),V(-1.0,1.7,-5),V(-4.0,0.6,-20),V(-8.5,-0.6,-36)]);
const ROAD_W=4.4,PAV=1.1,KERB=.15;
const frame=t=>{const P=path.getPointAt(t),T=path.getTangentAt(t);return {P,T,S:V(-T.z,0,T.x).normalize()};};
function ribbon(a,b,lift,c,N=120,t0=0,t1=1){const g=new THREE.BufferGeometry();const p=[],ind=[];
  for(let i=0;i<=N;i++){const {P,S}=frame(t0+(t1-t0)*i/N);for(const o of [a,b])p.push(P.x+S.x*o,P.y+lift,P.z+S.z*o);}
  for(let i=0;i<N;i++){const k=i*2;ind.push(k,k+1,k+2,k+1,k+3,k+2);}
  g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setIndex(ind);g.computeVertexNormals();const m=new THREE.Mesh(g,flat(c,true));m.receiveShadow=true;return m;}
scene.add(ribbon(-ROAD_W/2,ROAD_W/2,0,PAL.road));
scene.add(ribbon(-ROAD_W/2-PAV,-ROAD_W/2,KERB,PAL.pavement));scene.add(ribbon(ROAD_W/2,ROAD_W/2+PAV,KERB,PAL.pavement));
for(const o of [-ROAD_W/2,ROAD_W/2]){const g=new THREE.BufferGeometry();const p=[],ind=[];const N=120;
  for(let i=0;i<=N;i++){const {P,S}=frame(i/N);p.push(P.x+S.x*o,P.y,P.z+S.z*o,P.x+S.x*o,P.y+KERB,P.z+S.z*o);}
  for(let i=0;i<N;i++){const k=i*2;ind.push(k,k+1,k+2,k+1,k+3,k+2);}
  g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setIndex(ind);g.computeVertexNormals();scene.add(new THREE.Mesh(g,flat(PAL.kerb,true)));}
for(let i=0;i<9;i++){const {P,T}=frame(.05+i*.105);const m=new THREE.Mesh(new THREE.PlaneGeometry(.28,2.4),unlit(PAL.roadLine));m.position.copy(P).add(V(0,.012,0));m.rotation.set(-Math.PI/2,0,-Math.atan2(T.x,T.z));m.userData.noInk=true;scene.add(m);}
{const g=new THREE.Mesh(new THREE.PlaneGeometry(160,160),flat(0xb4b7ae));g.rotation.x=-Math.PI/2;g.position.y=-.02;g.receiveShadow=true;scene.add(g);}
/* the sea beyond the end of the street, a mountain silhouette, a harbour wall with a lighthouse */
{const sea=new THREE.Mesh(new THREE.PlaneGeometry(600,300),unlit(PAL.sea));sea.rotation.x=-Math.PI/2;sea.position.set(-40,-1.4,-190);sea.userData.noInk=true;scene.add(sea);
  const far=new THREE.Mesh(new THREE.PlaneGeometry(600,20),unlit(PAL.seaFar));far.position.set(-40,-1.3,-330);far.userData.noInk=true;scene.add(far);
  const shape=new THREE.Shape();shape.moveTo(-220,0);shape.lineTo(-150,9);shape.lineTo(-95,4);shape.lineTo(-40,16);shape.lineTo(10,11);shape.lineTo(60,17);shape.lineTo(120,6);shape.lineTo(200,10);shape.lineTo(260,0);shape.lineTo(-220,0);
  const m=new THREE.Mesh(new THREE.ShapeGeometry(shape),unlit(PAL.mountain));m.position.set(-40,-1.2,-320);m.userData.noInk=true;scene.add(m);
  const wall=box(60,1.6,2.2,PAL.concreteLt,-70,-.6,-150);wall.castShadow=false;scene.add(wall);const lh=cyl(.7,5,PAL.offwhite,-100,1.7,-150,10);scene.add(lh);scene.add(cyl(.9,.5,PAL.orange,-100,4.4,-150,10));}
function atRoad(t,o,obj,extraYaw=0){const {P,T,S}=frame(t);obj.position.set(P.x+S.x*o,P.y+(Math.abs(o)>ROAD_W/2?KERB:0),P.z+S.z*o);obj.rotation.y=Math.atan2(T.x,T.z)+extraYaw;scene.add(obj);return obj;}
const faceRoad=o=>o<0?-Math.PI/2:Math.PI/2; // a group's local +z is its front; turn it to face the road
/* ---------- continuous walls, with steps in height and an optional railing ---------- */
function wallRun(t0,t1,o,h,c,opt={}){const N=Math.max(2,Math.round((t1-t0)*80));const thick=opt.thick||.45;const g=new THREE.Group();
  const H=typeof h==='function'?h:()=>h;const ring=[];
  for(let i=0;i<=N;i++){const t=t0+(t1-t0)*i/N;const {P,S}=frame(t);const s=Math.sign(o);ring.push([P.clone().add(S.clone().multiplyScalar(o-s*thick/2)),P.clone().add(S.clone().multiplyScalar(o+s*thick/2)),H(t)]);}
  const pos=[],ind=[];let k=0;const quad=(a,b,c2,d)=>{pos.push(a.x,a.y,a.z,b.x,b.y,b.z,c2.x,c2.y,c2.z,d.x,d.y,d.z);ind.push(k,k+1,k+2,k,k+2,k+3);k+=4;};
  const up=(v,y)=>v.clone().add(V(0,y,0));
  for(let i=0;i<N;i++){const [i0,o0,h0]=ring[i],[i1,o1,h1]=ring[i+1];quad(i0,i1,up(i1,h1),up(i0,h0));quad(o1,o0,up(o0,h0),up(o1,h1));quad(up(i0,h0),up(i1,h1),up(o1,h1),up(o0,h0));
    if(Math.abs(h1-h0)>.01){quad(up(i1,Math.min(h0,h1)),up(o1,Math.min(h0,h1)),up(o1,Math.max(h0,h1)),up(i1,Math.max(h0,h1)));}}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setIndex(ind);geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,flat(c,true));m.castShadow=true;m.receiveShadow=true;g.add(m);
  if(opt.railing){for(let i=0;i<=N;i+=3){const [a,b,hh]=ring[i];const c3=a.clone().add(b).multiplyScalar(.5);g.add(cyl(.03,.95,PAL.rail,c3.x,c3.y+hh+.47,c3.z,6));}
    for(const ry of [.5,.95]){const rp=[];for(let i=0;i<=N;i++){const [a,b,hh]=ring[i];rp.push(a.clone().add(b).multiplyScalar(.5).add(V(0,hh+ry,0)));}
      const tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rp),N*2,.03,6,false),flat(PAL.rail));tube.castShadow=true;g.add(tube);}}
  scene.add(g);return g;}
const LW=-(ROAD_W/2+PAV+.28),RW=ROAD_W/2+PAV+.28;  // walls sit right behind the pavements
/* left: low wall with railing past the stairs, then a retaining wall that steps up twice */
wallRun(0,.24,LW,1.0,PAL.concrete,{railing:true});
wallRun(.42,1,LW,t=>t<.62?1.6:t<.8?2.3:3.0,PAL.concrete);
/* right: the shop's front wall is the building itself; beyond it a stepped beige wall, then concrete */
wallRun(.34,.7,RW,t=>t<.5?1.9:2.5,PAL.beige);
wallRun(.7,1,RW,2.8,PAL.concrete);
/* ---------- fixtures that attach to a wall face at (t, side): a small vocabulary of graphic shapes ---------- */
function onWall(t,o,y,fn){const g=new THREE.Group();fn(g);atRoad(t,o-Math.sign(o)*.23,g,faceRoad(o));g.position.y+=y;return g;}
const F={
  ac:g=>{g.add(box(1.0,.72,.5,PAL.offwhite,0,0,.25));g.add(plane(.42,.42,PAL.glass,.16,0,.51));g.add(plane(.5,.08,PAL.metal,-.18,.12,.51));g.add(plane(.5,.08,PAL.metal,-.18,-.12,.51));},
  pipe:g=>{g.add(cyl(.05,4.4,PAL.metal,0,1.4,.12,8));g.add(box(.45,.1,.1,PAL.metal,.2,3.55,.12));g.add(cyl(.05,.9,PAL.metal,.42,3.1,.12,8));},
  meter:g=>{g.add(box(.5,.65,.2,PAL.concreteLt,0,0,.1));g.add(plane(.28,.22,PAL.glass,0,.1,.21));},
  vent:g=>{g.add(plane(1.0,.42,PAL.glass,0,0,.02));for(let i=0;i<4;i++)g.add(plane(1.0,.04,PAL.rail,0,-.15+i*.1,.03));},
  signW:g=>{g.add(plane(.62,.9,PAL.offwhite,0,0,.03));g.add(plane(.36,.06,PAL.ink,0,.22,.04));g.add(plane(.36,.06,PAL.ink,0,.06,.04));g.add(plane(.2,.06,PAL.orange,-.08,-.14,.04));},
  signV:g=>{g.add(box(.5,1.9,.12,PAL.offwhite,0,0,.3));g.add(box(.06,.06,.36,PAL.metal,0,.7,.1));g.add(box(.06,.06,.36,PAL.metal,0,-.7,.1));g.add(plane(.22,.22,PAL.orange,0,.5,.37));g.add(plane(.22,.5,PAL.ink,0,-.15,.37));},
  lamp:g=>{g.add(box(.08,.08,.6,PAL.metal,0,0,.3));g.add(cyl(.18,.22,PAL.slate,0,-.16,.55,10));},
  cutout:g=>{g.add(plane(1.4,.9,PAL.glass,0,0,.02));},
  door:g=>{g.add(box(1.5,2.5,.18,PAL.beigeLt,0,.05,.04));g.add(plane(1.2,2.2,PAL.glass,0,-.05,.14));g.add(plane(.06,2.2,PAL.rail,0,-.05,.15));g.add(box(1.7,.12,.5,PAL.concreteLt,0,-1.26,.25));},
  shutter:g=>{g.add(plane(1.1,1.0,PAL.seafoam,0,0,.02));for(let i=0;i<5;i++)g.add(plane(1.1,.03,PAL.teal,0,-.4+i*.2,.03));},
  window:g=>{g.add(plane(1.2,1.0,PAL.glass,0,0,.02));g.add(plane(.05,1.0,PAL.rail,0,0,.03));},
};
/* ---------- things that stand on the pavement or road edge ---------- */
const G={
  cabinet:(w=1.4,h=1.9)=>{const g=new THREE.Group();g.add(box(w,h,.9,PAL.offwhite,0,h/2,0));g.add(plane(.36,.5,PAL.slate,w*.25,h*.6,.46));g.add(plane(.05,h*.7,PAL.rail,-w*.15,h*.5,.46));return g;},
  bollard:()=>{const g=new THREE.Group();g.add(cyl(.09,.85,PAL.metal,0,.42,0,10));g.add(cyl(.11,.08,PAL.slate,0,.86,0,10));return g;},
  drain:()=>{const g=new THREE.Group();const p=plane(.55,.9,PAL.glass,0,.005,0,0,-Math.PI/2);g.add(p);for(let i=0;i<4;i++){const b=plane(.55,.05,PAL.metal,0,.01,-.32+i*.21,0,-Math.PI/2);g.add(b);}return g;},
  pot:(n=5)=>{const g=new THREE.Group();g.add(mesh(new THREE.CylinderGeometry(.24,.19,.42,10),flat(PAL.pot),0,.21,0));for(let i=0;i<n;i++){const leaf=new THREE.Mesh(new THREE.PlaneGeometry(.14,.8),flat(PAL.plant,true));leaf.position.set((i-n/2)*.07,.75,0);leaf.rotation.set(0,i*.8,(i-n/2)*.22);g.add(leaf);}return g;},
  planter:()=>{const g=new THREE.Group();g.add(box(1.0,.5,.5,PAL.pot,0,.25,0));for(let i=0;i<7;i++){const leaf=new THREE.Mesh(new THREE.PlaneGeometry(.12,.7),flat(PAL.plant,true));leaf.position.set((i-3)*.13,.78,0);leaf.rotation.set(0,i*.7,(i-3)*.2);g.add(leaf);}return g;},
  pole:(h=8.5)=>{const g=new THREE.Group();g.add(cyl(.13,h,PAL.metal,0,h/2,0,10));g.add(box(1.5,.12,.12,PAL.metal,0,h-.6,0));g.add(box(1.1,.12,.12,PAL.metal,0,h-1.3,0));g.add(cyl(.2,.7,PAL.slate,-.55,h-.95,0,8));g.add(box(.34,.42,.34,PAL.slate,.42,h-2.2,0));return g;},
  sign:(c=PAL.slate)=>{const g=new THREE.Group();g.add(cyl(.045,2.9,PAL.rail,0,1.45,0,6));const d=mesh(new THREE.CylinderGeometry(.42,.42,.06,20),flat(c),0,3.1,0);d.rotation.x=Math.PI/2;g.add(d);g.add(plane(.6,.42,PAL.orange,0,2.3,.05));return g;},
  post:()=>{const g=new THREE.Group();g.add(cyl(.04,1.1,PAL.rail,0,.55,0,6));return g;},
  bin:()=>{const g=new THREE.Group();g.add(box(.55,.8,.55,PAL.slate,0,.4,0));g.add(box(.6,.08,.6,PAL.metal,0,.84,0));return g;},
  crate:()=>{const g=new THREE.Group();g.add(box(.7,.5,.5,PAL.teal,0,.25,0));g.add(box(.7,.5,.5,PAL.teal,0,.75,.05,.12));return g;},
};
/* ---------- LEFT SIDE: stairs beside a dark house, then a stepped retaining wall with fixtures ---------- */
{const g=new THREE.Group();const W=6.4,D=6.5,H=8.2;
  g.add(box(W,H,D,PAL.darkHouse,0,H/2,-D/2));g.add(box(W+.5,.32,D+.5,PAL.slate,0,H+.1,-D/2));
  for(const [x,y] of [[-1.7,6.3],[.6,6.3]])g.add(plane(1.2,1.0,PAL.glass,x,y,.02));
  g.add(plane(1.2,1.0,PAL.seafoam,-1.7,3.9,.02));for(let i=0;i<5;i++)g.add(plane(1.2,.03,PAL.teal,-1.7,3.5+i*.2,.03));
  g.add(box(2.2,.1,.6,PAL.concreteLt,.4,5.6,.32));g.add(cyl(.03,.9,PAL.rail,-.6,6.1,.6,6));g.add(cyl(.03,.9,PAL.rail,1.4,6.1,.6,6));g.add(box(2.1,.04,.04,PAL.rail,.4,6.55,.6)); // small balcony ledge + rail
  // stair flight along the front, from the pavement (right end) up to a landing (left end)
  const steps=11,run=.56,rise=.31;for(let i=0;i<steps;i++){const h=rise*(i+1);g.add(box(run,h,1.3,PAL.concreteLt,W/2-run*(i+.5),h/2,1.25));}
  g.add(box(2.2,.34,1.3,PAL.concreteLt,W/2-run*steps-1.1,rise*steps-.17,1.25));
  g.add(box(run*steps+2.2,rise*steps+.5,.22,PAL.concrete,W/2-(run*steps+2.2)/2,(rise*steps+.5)/2,.5));
  const railg=new THREE.Group();for(let i=0;i<=steps;i+=2){railg.add(cyl(.03,1.0,PAL.rail,W/2-run*i-.05,rise*i+.5,1.95,6));}
  const L=Math.hypot(run*steps,rise*steps);const r=cyl(.028,L,PAL.rail,W/2-run*steps/2,rise*steps/2+1.0,1.95,6);r.rotation.z=-(Math.PI/2-Math.atan2(rise,run));railg.add(r);g.add(railg);
  g.add(box(.9,.7,.45,PAL.offwhite,-2.4,.36,.9));g.add(plane(.36,.36,PAL.glass,-2.4,.36,1.13));   // AC by the base
  atRoad(.27,LW-3.4,g,faceRoad(-1));}
atRoad(.06,LW+.95,G.bollard());atRoad(.10,LW+.95,G.bollard());
atRoad(.08,-ROAD_W/2+.32,G.drain());atRoad(.44,-ROAD_W/2+.32,G.drain());atRoad(.8,-ROAD_W/2+.32,G.drain());
atRoad(.15,LW+.75,G.cabinet(1.3,1.7));
atRoad(.19,LW+.6,G.pot(5));
atRoad(.36,LW+.62,G.cabinet(1.6,2.0));atRoad(.39,LW+.55,G.crate());
onWall(.46,LW,1.0,F.meter);onWall(.49,LW,0,F.pipe);
onWall(.55,LW,1.1,F.signW);onWall(.23,LW,1.3,g=>{g.add(plane(.7,.95,PAL.offwhite,0,0,.03));g.add(plane(.34,.1,PAL.ink,0,.25,.04));g.add(plane(.34,.1,PAL.ink,0,.05,.04));g.add(plane(.3,.08,PAL.ink,.02,-.2,.04));g.add(plane(.1,.2,PAL.ink,.2,-.2,.04));});
atRoad(.58,LW+.55,G.pot(4));atRoad(.6,LW+.55,G.pot(6));
onWall(.66,LW,1.3,F.lamp);onWall(.7,LW,1.5,F.vent);
onWall(.76,LW,0,F.pipe);onWall(.8,LW,1.9,F.ac);
atRoad(.86,LW+.75,G.cabinet(1.2,1.5));atRoad(.9,LW+.9,G.bollard());
onWall(.92,LW,2.2,F.signW);
/* a second house rises behind the left retaining wall */
{const g=new THREE.Group();g.add(box(8,6.8,7,PAL.beigeLt,0,3.4,-3.5));g.add(box(8.5,.3,7.5,PAL.slate,0,6.95,-3.5));
  for(const x of [-2.4,0,2.4])g.add(plane(1.2,1.0,PAL.glass,x,5.4,.02));g.add(box(.9,.7,.45,PAL.offwhite,2.6,4.2,.25));
  atRoad(.62,LW-3.8,g,faceRoad(-1));g.position.y+=1.6;}
/* ---------- RIGHT SIDE: shop front hard on the pavement, then fixtures along a stepped wall ---------- */
{const g=new THREE.Group();const W=8,D=6,H=7;
  g.add(box(W,H,D,PAL.beige,0,H/2,-D/2));g.add(box(W+.5,.3,D+.5,PAL.slate,0,H+.1,-D/2));
  g.add(plane(2.4,2.8,PAL.orange,-1.9,1.5,.02));g.add(plane(.07,2.8,PAL.ink,-1.9,1.5,.03));g.add(plane(.5,.5,PAL.offwhite,-2.5,2.3,.04));  // sliding door
  g.add(box(3.2,.18,1.1,PAL.seafoam,-1.9,3.2,.5));                                            // small canopy
  g.add(plane(2.6,.8,PAL.glass,1.6,5.2,.02));for(let i=0;i<5;i++)g.add(plane(.05,.8,PAL.rail,.6+i*.5,5.2,.03));
  const ring=mesh(new THREE.TorusGeometry(.5,.13,8,24),flat(PAL.orange),2.0,3.1,.15);g.add(ring);
  g.add(plane(.55,.75,PAL.offwhite,3.3,2.8,.02));g.add(plane(.55,.75,PAL.offwhite,3.3,1.85,.02));g.add(plane(.3,.08,PAL.ink,3.3,2.95,.03));g.add(plane(.3,.08,PAL.ink,3.3,2.0,.03));

const rt=new THREE.WebGLRenderTarget(2,2,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});rt.depthTexture=new THREE.DepthTexture();rt.depthTexture.type=THREE.UnsignedIntType;

  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:`precision highp float;varying vec2 vUv;uniform sampler2D tColor,tDepth,tNormal;uniform vec2 res;uniform float near,far;uniform vec3 inkCol;

  void main(){vec2 px=1./res;float d0=lin(texture2D(tDepth,vUv).x);vec3 n0=texture2D(tNormal,vUv).xyz*2.-1.;
