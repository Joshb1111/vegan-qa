<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Far Field · room test</title>
<base href="/">
<link rel="icon" href="data:,">
<!-- Test page for public/farfield-room.js (the arcade wrapper) outside the planet: mounts the room as planet.html would, so
     the menu, the content notice, Play, mute/music messages, Exit and teardown can be tested. OWNER: the audio + UI + room
     builder. Not linked from anywhere. Served from /farfield/room-test.html, so the room's iframe path is made relative to /. -->
<style>
html,body{margin:0;height:100%;background:#0b0d10;color:#c6ced6;font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
#house{position:absolute;inset:0}
#arcade{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#arcade h3{letter-spacing:.4em;font-weight:300;margin:0 0 6px}
#arcade .sub,#arcade .msg{max-width:520px;color:#9aa6b2;margin:4px 16px}
#arcade button{font:inherit;color:#c6ced6;background:transparent;border:1px solid #3a434c;border-radius:3px;padding:7px 18px;margin-top:12px;cursor:pointer}
#arcade .tyframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#bar{position:absolute;right:8px;top:8px;z-index:5;display:flex;gap:6px}
#bar button{font:12px ui-monospace,Menlo,monospace;color:#c6ced6;background:rgba(8,10,12,.7);border:1px solid #3a434c;border-radius:3px;padding:3px 8px;cursor:pointer}
</style></head><body>
<div id="house"></div>
<div id="bar"><button id="leave" type="button">leave room</button><button id="enter" type="button">enter room</button></div>
<script src="/farfield-room.js?v=1"></script>
<script>
'use strict';
let stop = null;
const enter = () => { if (stop) return; stop = farfieldRoom(document.getElementById('house'), { musicOn: true }); window.__room = { stop }; };
document.getElementById('enter').onclick = enter;
document.getElementById('leave').onclick = () => { if (stop) { stop(); stop = null; } };
enter();
</script>
</body></html>
