<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>The Planet — Understand Veganism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Karla:wght@400;700&display=swap">
<style>
:root{--ink:#26333a;--cream:#f3efe4;--cream2:#e6e0cf;--teal:#8fc7c2;--teal2:#6fb3ad;--green:#b9cf9a;--green2:#8fb07a;--grey:#c9cec8;--grey2:#a9b0ac;--orange:#e8792b;--red:#c8402f;--muted:#5f6d72;--hand:"Patrick Hand","Segoe Print","Bradley Hand",cursive;--body:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8fc7c2;font-family:var(--body);color:var(--ink);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
#game{position:fixed;inset:0;outline:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#c.drag{cursor:grabbing}
.ink{background:var(--cream);border:2.5px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink)}
button.ink:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* ---------- HUD ---------- */
#hint{position:absolute;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);font-family:var(--hand);font-size:19px;background:rgba(243,239,228,.85);padding:4px 14px;border-radius:999px;pointer-events:none;white-space:nowrap;transition:opacity .8s}
#hint.gone{opacity:0}
#prompt{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);max-width:calc(100vw - 150px);padding:8px 18px 6px;text-align:center;pointer-events:none;transition:opacity .2s,transform .2s}
#prompt.off{opacity:0;transform:translate(-50%,-8px)}
#prompt b{display:block;font-family:var(--hand);font-weight:normal;font-size:23px;line-height:1.1}
#prompt span{color:var(--muted);font-size:13px}
#pad{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;gap:12px}
#pad .dpad{margin-left:auto}
#stick{width:150px;height:150px;border-radius:50%;background:rgba(243,239,228,.55);position:relative;touch-action:none;flex:none;align-self:flex-end}
#stick[hidden]{display:none}
#knob{position:absolute;left:47px;top:47px;width:56px;height:56px;border-radius:50%;background:var(--cream);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);pointer-events:none}
body.touch .dpad{display:none}
body.touch #stick{display:block}
body.touch .tpad{margin-left:auto}
#jumpbtn{width:74px;height:74px;border-radius:50%;margin-left:auto;font-size:15px;align-self:flex-end}
#jumpbtn[hidden]{display:none}
.tpad[hidden]{display:none}
.tpad{display:grid;grid-template-columns:repeat(3,58px);gap:8px;align-self:flex-end}
.tpad button{width:58px;height:58px;font-size:13px;line-height:1.05;padding:0}
.tpad [data-t=manual]{grid-column:1/3;width:auto}
#score{position:absolute;left:14px;top:calc(max(14px,env(safe-area-inset-top)) + 8px);z-index:4;padding:6px 12px;font-family:var(--hand);font-size:20px;pointer-events:none}
#trickname{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:4;text-align:center;font-family:var(--hand);font-size:34px;color:var(--ink);text-shadow:0 2px 0 #fff,0 0 12px #fff;pointer-events:none;opacity:0;transition:opacity .25s}
#trickname.show{opacity:1}
#trickname small{display:block;font-size:20px;color:#c8402f}
#balance{position:absolute;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);width:200px;height:14px;border:2.5px solid var(--ink);border-radius:8px;background:var(--cream);z-index:4;pointer-events:none}
#balance i{position:absolute;top:-6px;width:10px;height:22px;margin-left:-5px;border-radius:5px;background:#c8402f;border:2px solid var(--ink);left:50%}
#balance b{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);opacity:.4}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px}
.dpad .dir{appearance:none;width:58px;height:58px;font-size:20px;cursor:pointer;touch-action:none;padding:0}
.dpad [data-k=u]{grid-column:2;grid-row:1}.dpad [data-k=l]{grid-column:1;grid-row:2}.dpad [data-k=d]{grid-column:2;grid-row:2}.dpad [data-k=r]{grid-column:3;grid-row:2}
.dpad .dir.down{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);background:var(--cream2)}
#ba{appearance:none;min-width:140px;height:58px;margin-bottom:2px;font-family:var(--hand);font-size:24px;background:var(--orange);color:var(--cream);cursor:pointer;transition:opacity .2s,transform .2s;padding:0 22px 2px}
#ba.off{opacity:0;transform:scale(.9);pointer-events:none}
@media (hover:hover) and (pointer:fine){.dpad .dir{opacity:.75}}
#menubtn{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;width:52px;height:52px;appearance:none;cursor:pointer;padding:0;display:grid;place-items:center}
#menubtn svg{width:30px;height:30px}
#musicbtn{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 62px);right:14px;width:52px;height:52px;appearance:none;cursor:pointer;padding:0;font-size:24px;line-height:1}
#musicbtn[aria-pressed=false]{background:var(--cream2);color:var(--muted);text-decoration:line-through}
#ba{position:fixed;left:0;top:0;transform:translate(-50%,-50%);z-index:5;margin:0;min-width:0;height:auto;padding:6px 16px 4px;font-size:21px;white-space:nowrap}
#ba.off{transform:translate(-50%,-50%) scale(.9)}
#stops{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 62px);right:14px;width:min(300px,calc(100vw - 28px));padding:10px;z-index:5;max-height:70vh;overflow:auto}
#stops[hidden]{display:none}
#stops h2{margin:2px 6px 8px;font-family:var(--hand);font-weight:normal;font-size:24px}
#stops button{appearance:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:2px dashed var(--grey2);padding:8px 6px;font-family:var(--hand);font-size:21px;cursor:pointer;line-height:1.1}
#stops button:first-of-type,#stops h2+button{border-top:0}
#stops h2+h2,#stops button+h2{margin-top:14px}
#stops button:hover{background:var(--cream2)}
#stops button i{width:22px;height:22px;border:2px solid var(--ink);border-radius:50%;flex:none}
#stops button small{margin-left:auto;font-family:var(--body);font-size:12px;color:var(--muted)}
@media (max-width:420px){#ba{min-width:112px;height:54px;font-size:21px;padding:0 14px 2px}}

/* ---------- title card ---------- */
#title{position:fixed;inset:0;background:var(--cream);display:grid;place-items:center;z-index:20;transition:opacity .5s;cursor:pointer}
#title.gone{opacity:0;pointer-events:none}
#title .tcard{text-align:center;padding:24px;max-width:560px}
#title svg{width:150px;height:150px;display:block;margin:0 auto 8px}
#title h1{font-family:var(--hand);font-weight:normal;font-size:clamp(34px,7vw,54px);margin:0;letter-spacing:.06em;text-transform:uppercase;line-height:1}
#title p{font-family:var(--hand);font-size:22px;margin:10px 0 0;color:var(--muted);line-height:1.25}
#title p b{color:var(--ink);font-weight:normal}
#title p.err{color:var(--red)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#title svg{animation:bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){#title svg{animation:none}}

/* ---------- talking to someone ---------- */
#chat{position:fixed;left:50%;bottom:0;transform:translate(-50%,0);width:min(680px,100vw);max-height:min(62vh,520px);display:flex;flex-direction:column;z-index:10;border-radius:14px 14px 0 0;border-bottom:0;box-shadow:0 -4px 0 var(--ink);transition:transform .3s;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
#chat.off{transform:translate(-50%,110%)}
#chat header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
#chat header b{font-family:var(--hand);font-weight:normal;font-size:26px;line-height:1}
#chat header small{color:var(--muted);font-size:13px}
#chat header .sp{flex:1}
#chat header button{appearance:none;padding:4px 12px 2px;font-family:var(--hand);font-size:19px;cursor:pointer;white-space:nowrap}
@media (max-width:420px){#chat header b{font-size:22px}#chat header small{display:none}#chat header button{font-size:17px;padding:3px 9px 1px}}
#chat header button[aria-pressed=false]{background:var(--cream2);color:var(--muted)}
#bubble{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.5;overflow:auto;max-height:26vh;flex:1 1 auto;min-height:56px;position:relative;min-height:56px}
#bubble:before{content:"";position:absolute;left:28px;top:-13px;width:18px;height:18px;background:#fff;border-left:2.5px solid var(--ink);border-top:2.5px solid var(--ink);transform:rotate(45deg)}
#bubble .key{display:block;margin-top:10px;padding-top:8px;border-top:2px dashed var(--grey2);font-family:var(--hand);font-size:19px;line-height:1.25}
#bubble .thinking{color:var(--muted);font-style:italic}
#chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px;flex:none}
@media (max-height:520px){#chips{display:none}#chat .note{display:none}}
#chips button{appearance:none;background:var(--cream2);border:2px solid var(--ink);border-radius:999px;padding:5px 12px 3px;font-family:var(--hand);font-size:17px;cursor:pointer;line-height:1.1}
#chips button:hover{background:#fff}
#ask{display:flex;gap:8px;margin-top:10px}
#q{flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 12px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
#q:focus{outline:3px solid var(--teal2);outline-offset:1px}
#send{appearance:none;padding:0 18px;font-family:var(--hand);font-size:22px;background:var(--orange);color:var(--cream);cursor:pointer}
#send:disabled{opacity:.6;cursor:default}
#chat .note{margin:8px 0 0;font-size:12px;color:var(--muted)}

/* ---------- comic speech bubbles ---------- */
.sb{position:absolute;left:0;top:0;max-width:min(360px,70vw);background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 16px 12px;font-family:var(--hand);font-size:21px;line-height:1.2;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;z-index:6;box-shadow:3px 3px 0 rgba(38,51,58,.25);transition:opacity .2s}
.sb:after,.sb:before{content:"";position:absolute;left:50%;bottom:-16px;margin-left:-14px;border:14px solid transparent;border-top:16px solid var(--ink);border-bottom:0}
.sb:after{bottom:-11px;border-top-color:#fff}
.sb.key:after{border-top-color:#fff8dc}.sb.me:after{border-top-color:var(--cream)}
.sb[hidden]{display:none}
.sb .more{display:block;text-align:right;font-size:14px;letter-spacing:.1em;color:var(--muted);margin-top:4px}
.sb.key{background:#fff8dc}
.sb.me{background:var(--cream)}
.sb .dots span{display:inline-block;animation:blink 1.2s infinite}.sb .dots span:nth-child(2){animation-delay:.2s}.sb .dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
#chat{max-height:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));width:min(720px,100vw)}
#chat header{margin-bottom:6px}#chat header b{font-size:22px}
#bubble{display:none}
#chips{margin:0 0 6px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;font-size:16px;padding:4px 11px 2px}
#ask{margin-top:4px}#q{padding:8px 12px;font-size:16px}#send{font-size:20px;padding:0 14px}
#chat .note{display:none}
@media (max-height:520px){#chips{display:flex}}
</style>
</head>
<body>
<div id="game" tabindex="0" aria-label="A small town on a round planet, seen from behind the walker. Use the arrow keys to walk; walk up to someone to ask them a question.">
  <canvas id="c"></canvas>
  <div id="hint">↑ ↓ to walk · ← → to turn · walk up to someone</div>
  <div id="prompt" class="off ink"><b></b><span></span></div>
  <button id="menubtn" class="ink" type="button" aria-label="People" aria-expanded="false"><svg viewBox="0 0 30 30" fill="none" stroke="#26333a" stroke-width="2.6" stroke-linecap="round"><path d="M9 8h15M9 15h15M9 22h15"/><circle cx="4.5" cy="8" r="1.4" fill="#26333a"/><circle cx="4.5" cy="15" r="1.4" fill="#26333a"/><circle cx="4.5" cy="22" r="1.4" fill="#26333a"/></svg></button>
  <button id="musicbtn" class="ink" type="button" aria-label="Music" aria-pressed="true">♪</button>
  <div id="score" class="ink" hidden>0</div>
  <div id="trickname"></div>
  <div id="balance" hidden><b></b><i></i></div>
  <nav id="stops" class="ink" hidden aria-label="People on the planet"><h2>People</h2></nav>
  <div id="pad">
    <button id="ba" class="off ink" type="button">Talk</button>
    <div id="stick" class="ink" hidden aria-label="Move"><div id="knob"></div></div>
    <div id="tricks" class="tpad" hidden aria-label="Tricks">
      <button class="dir ink" type="button" data-t="ollie" aria-label="Ollie (Space)">Ollie</button>
      <button class="dir ink" type="button" data-t="kickflip" aria-label="Kickflip (F)">Kick<br>flip</button>
      <button class="dir ink" type="button" data-t="heelflip" aria-label="Heelflip (G)">Heel<br>flip</button>
      <button class="dir ink" type="button" data-t="shoveit" aria-label="Shove-it (V)">Shove</button>
      <button class="dir ink" type="button" data-t="manual" aria-label="Manual (hold M)">Manual</button>
    </div>
    <button id="jumpbtn" class="dir ink" type="button" hidden aria-label="Jump">Jump</button>
    <div class="dpad" aria-label="Walk">
      <button class="dir ink" type="button" data-k="u" aria-label="Walk forward">▲</button>
      <button class="dir ink" type="button" data-k="l" aria-label="Turn left">◀</button>
      <button class="dir ink" type="button" data-k="d" aria-label="Walk back">▼</button>
      <button class="dir ink" type="button" data-k="r" aria-label="Turn right">▶</button>
    </div>
  </div>
</div>
<section id="chat" class="ink off" aria-live="polite">
  <header><b id="chat-name">Someone</b><small id="chat-sub"></small><span class="sp"></span><button type="button" class="ink" id="voice" aria-pressed="true">Voice on</button><button type="button" class="ink" id="bye">Bye</button></header>
  <div id="bubble"></div>
  <div id="chips"></div>
  <form id="ask" autocomplete="off"><input id="q" type="text" maxlength="300" placeholder="Ask anything about veganism…" aria-label="Your question"><button id="send" class="ink" type="submit">Ask</button></form>
  <p class="note">Answers come from the Understand Veganism chatbot.</p>
</section>
<div id="sbN" class="sb" hidden></div>
<div id="sbMe" class="sb me" hidden></div>
<div id="title" role="button" aria-label="Start">
  <div class="tcard">
    <svg viewBox="0 0 150 150" fill="none" stroke="#26333a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="75" cy="112" r="62" fill="#b9cf9a"/>
      <path d="M13 112a62 62 0 0 0 124 0" fill="#7b9597"/>
      <path d="M22 112h106" stroke="#f3efe4" stroke-dasharray="8 7"/>
      <path d="M40 52v-24h30v24" fill="#f3efe4"/><path d="M36 30l19-14 19 14z" fill="#c8785a"/>
      <path d="M80 52v-34h26v34" fill="#cfd8b8"/><path d="M84 24h6v6h-6zM94 24h6v6h-6zM84 36h6v6h-6zM94 36h6v6h-6z" fill="#9fd0cb"/>
      <circle cx="120" cy="44" r="6" fill="#f2cfae"/><path d="M114 40a6 6 0 0 1 12 0" fill="#2a2430"/><path d="M115 52h10v14h-10z" fill="#e8792b"/><path d="M116 66h8v7h-8z" fill="#c8402f"/>
      <circle cx="26" cy="46" r="6" fill="#f2cfae"/><path d="M20 42a6 6 0 0 1 12 0" fill="#5a3b2a"/><path d="M21 54h10v14h-10z" fill="#4f86b3"/><path d="M22 68h8v7h-8z" fill="#26333a"/>
    </svg>
    <h1>Understand<br>Veganism</h1>
    <p id="title-p">a small town on a small planet<br><b>&uarr; &darr;</b> to walk, <b>&larr; &rarr;</b> to turn<br>walk up to anyone and <b>ask them a question</b></p>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
if(!window.THREE){$('#title-p').className='err';$('#title-p').textContent='The 3D library could not load. Check the connection and reload.';return;}
const API='/api/ask'; // hosted inside the vegan-qa project, so this is same-origin
const ANSWERS={}; // pre-generated answers for the suggested questions (public/planet-answers.json) — free and instant
fetch('planet-answers.json').then(r=>r.ok?r.json():{}).then(j=>Object.assign(ANSWERS,j)).catch(()=>{});
const normQ=q=>q.toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').trim();

const P={ink:0x26333a,sky:0x8fc7c2,sky2:0x6fb3ad,sky3:0xa6d5d0,cream:0xf3efe4,cream2:0xe6e0cf,green:0xb9cf9a,green2:0x8fb07a,green3:0x6d905a,grass:'#a9c68f',road:'#7b9597',pave:'#c9cec8',grey:0xc9cec8,grey2:0xa9b0ac,orange:0xe8792b,red:0xc8402f,skin:0xf2cfae,hair:0x2a2430,blue:0x4f86b3,glass:0x9fd0cb,wood:0x7d6540,yellow:0xf3d24a,terracotta:0xc8785a,slate:0x5f7e8c};
const WALLS=[0xf3efe4,0xcfd8b8,0xc4ccd0,0xd8d2c4,0xe7d5cd,0xf6f4ee,0xb9cf9a,0xd9cfb0];
const ROOFS=[0x8fb07a,0xc8785a,0x5f7e8c,0x7d6540,0x6d905a];

/* =====================================================================
   SCENE
   ===================================================================== */
const R=50;
const game=$('#game'), canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
const DPR=Math.min(devicePixelRatio||1,2);renderer.setPixelRatio(DPR);
const scene=new THREE.Scene(); scene.background=new THREE.Color(P.sky);
const camera=new THREE.PerspectiveCamera(64,1,0.3,900); scene.add(camera);
const sun=new THREE.DirectionalLight(0xfff6e8,0.30); sun.position.set(4,7,3); camera.add(sun); sun.target.position.set(0,0,-10); camera.add(sun.target);
scene.add(new THREE.AmbientLight(0xffffff,0.78));
/* Cast shadow for the main character. An unseen sun (zero intensity, so it changes no colours) follows the
   player and casts a shadow map onto a small curved patch of shadow-only ground that also follows them.
   The sun sits high and a little to the east/north of wherever the player stands, so the shadow always
   falls the same way relative to the street. */
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.shadowMap.autoUpdate=false;
const sunL=new THREE.DirectionalLight(0xffffff,0);sunL.castShadow=true;sunL.shadow.mapSize.set(1024,1024);
Object.assign(sunL.shadow.camera,{left:-3.5,right:3.5,top:3.5,bottom:-3.5,near:2,far:40});sunL.shadow.bias=-0.0015;sunL.shadow.normalBias=.02;sunL.shadow.camera.updateProjectionMatrix();
scene.add(sunL);scene.add(sunL.target);
const shadowCap=new THREE.Mesh(new THREE.SphereGeometry(R+.075,48,8,0,Math.PI*2,0,.1),new THREE.ShadowMaterial({color:0x1b2630,opacity:.34,transparent:true,depthWrite:false}));
shadowCap.receiveShadow=true;shadowCap.userData.skipInk=true;shadowCap.frustumCulled=false;scene.add(shadowCap);
const _se=new THREE.Vector3(),_sn=new THREE.Vector3(),_sd=new THREE.Vector3(),_sm=new THREE.Matrix4();
function updateSky(up){if(!skyDome)return;_se.set(0,1,0);if(Math.abs(up.y)>.98)_se.set(1,0,0);_se.addScaledVector(up,-_se.dot(up)).normalize();_sn.crossVectors(_se,up);_sm.makeBasis(_se,up,_sn);skyDome.quaternion.setFromRotationMatrix(_sm);if(nightDome)nightDome.quaternion.copy(skyDome.quaternion);}
function updateShadowRig(pos,up,q){shadowCap.quaternion.copy(q);shadowCap.position.copy(up).multiplyScalar(terrainH(up)+parkH(up)); /* cap pole = local Y = up, so the patch hugs the ground under the player */
  _se.set(-up.z,0,up.x).normalize();_sn.crossVectors(_se,up).normalize();
  _sd.copy(up).multiplyScalar(1.6).addScaledVector(_se,.7).addScaledVector(_sn,.5).normalize();
  sunL.position.copy(pos).addScaledVector(_sd,18);sunL.target.position.copy(pos);sunL.target.updateMatrixWorld();}
let W=0,H=0;
/* Ink pass: the scene is rendered to a colour+depth target and a normals target, then a full-screen
   shader draws hand-drawn lines wherever depth or normals break, with a little wobble and broken

function unlockAudio(){const c=ensureCtx();if(c&&c.state==='suspended')c.resume().catch(()=>{});if(audioUnlocked)return;try{voiceAudio.src=SILENCE;const p=voiceAudio.play();if(p&&p.then)p.then(()=>{audioUnlocked=true;}).catch(()=>{});}catch(_){}}
function browserSpeak(text,n){if(!canSpeak)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const vc=pickVoice(n);if(vc)u.voice=vc;u.rate=n.rate||1;u.pitch=n.pitch||1;speechSynthesis.speak(u);}
function stopSpeech(){speakSeq++;try{voiceAudio.pause();}catch(_){}if(canSpeak)speechSynthesis.cancel();}
async function speak(text,n){if(!voiceOn)return;stopSpeech();const seq=speakSeq;
  if(hosted[n.name]!==false){try{const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),25000);
      const r=await fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({who:n.name,text}),signal:ctrl.signal});clearTimeout(to);
      if(r.status===404){hosted[n.name]=false;bubbleStart();}
      else if(r.ok){const blob=await r.blob();if(seq!==speakSeq||!voiceOn)return;const url=URL.createObjectURL(blob);voiceAudio.src=url;voiceAudio.onended=()=>URL.revokeObjectURL(url);await voiceAudio.play();hosted[n.name]=true;return;}
    }catch(e){console.warn('hosted voice fell back:',e&&e.name);}}
  bubbleStart();if(seq===speakSeq)browserSpeak(text,n);}
if(canSpeak)speechSynthesis.onvoiceschanged=()=>{};
let typer=null;

/* =====================================================================
   SPEECH BUBBLES — text appears above the speaker's head in short comic-style chunks
   ===================================================================== */
const sbN=$('#sbN'),sbMe=$('#sbMe');
const bubble={chunks:[],i:0,timer:null,who:null,key:'',pending:false};
const _proj=new THREE.Vector3();
function placeBubble(el,worldPos,lift){_proj.copy(worldPos).project(camera);if(_proj.z>1){el.style.opacity=0;return;}el.style.opacity=1;
  const x=clamp((_proj.x+1)/2*W,190,W-190),y=(1-_proj.y)/2*H-(lift||14);el.style.left=x+'px';el.style.top=y+'px';}
function headOf(obj,h){return obj.position.clone().add(obj.position.clone().normalize().multiplyScalar(h));}
function splitChunks(text,max){const parts=text.replace(/\s+/g,' ').trim().match(/[^.!?…]+[.!?…]+["’”)]?|[^.!?…]+$/g)||[text];const out=[];let cur='';
  for(const p of parts){const t=p.trim();if(!t)continue;if(cur&&(cur+' '+t).length>max){out.push(cur);cur=t;}else cur=cur?cur+' '+t:t;
    while(cur.length>max*1.6){const cut=cur.lastIndexOf(' ',max);out.push(cur.slice(0,cut));cur=cur.slice(cut+1);}}
  if(cur)out.push(cur);return out;}
function showChunk(){clearTimeout(bubble.timer);const n=bubble.who;if(!n)return;const i=bubble.i;
  if(i>=bubble.chunks.length){if(bubble.key){sbN.className='sb key';sbN.innerHTML=esc(bubble.key);bubble.key='';return;}sbN.hidden=true;return;}
  const last=i===bubble.chunks.length-1&&!bubble.key;sbN.className='sb';sbN.innerHTML=esc(bubble.chunks[i])+(last?'':'<span class="more">▼</span>');sbN.hidden=false;
  const chars=bubble.chunks[i].length,total=bubble.chunks.reduce((a,c)=>a+c.length,0);
  let dur=Math.max(2.4,chars/13);
  const a=voiceAudio;if(a&&!a.paused&&a.src!==SILENCE&&isFinite(a.duration)&&a.duration>0){ /* paced to the voice: this chunk stays up until the audio reaches the end of its share of the text */
    const cum=bubble.chunks.slice(0,i+1).reduce((s_,c)=>s_+c.length,0);const endAt=a.duration*cum/total;dur=Math.max(.8,endAt-a.currentTime+(last?.8:.2));}
  bubble.timer=setTimeout(()=>{bubble.i++;showChunk();},dur*1000);}
/* the bubble waits (with dots) until the hosted voice actually starts, so the words never run ahead of the speech */
function bubbleStart(){if(!bubble.pending)return;bubble.pending=false;clearTimeout(bubble.timer);showChunk();}
voiceAudio.addEventListener('playing',()=>{if(voiceAudio.src!==SILENCE)bubbleStart();});
function sayBubble(n,text,key,waitVoice){clearTimeout(bubble.timer);bubble.who=n;bubble.chunks=splitChunks(text,150);bubble.i=0;bubble.key=key||'';
  if(waitVoice){bubble.pending=true;sbN.className='sb';sbN.innerHTML='<span class="dots"><span>•</span><span>•</span><span>•</span></span>';sbN.hidden=false;bubble.timer=setTimeout(bubbleStart,8000);}
  else{bubble.pending=false;showChunk();}}
function nextChunk(){if(!bubble.who)return;if(bubble.i<bubble.chunks.length){bubble.i++;showChunk();}else if(bubble.key){showChunk();}else sbN.hidden=true;}
sbN.addEventListener('click',nextChunk);
function thinkingBubble(n){clearTimeout(bubble.timer);bubble.who=n;bubble.chunks=[];bubble.key='';sbN.className='sb';sbN.innerHTML='<span class="dots"><span>•</span><span>•</span><span>•</span></span>';sbN.hidden=false;}
function meBubble(text){sbMe.innerHTML=esc(text);sbMe.hidden=false;clearTimeout(sbMe._t);sbMe._t=setTimeout(()=>{sbMe.hidden=true;},Math.max(2000,text.length*60));}
function hideBubbles(){clearTimeout(bubble.timer);bubble.who=null;bubble.pending=false;sbN.hidden=true;sbMe.hidden=true;}
function say(html,n,plainForVoice,key){if(typer){clearInterval(typer);typer=null;}const plain=plainForVoice||html.replace(/<[^>]+>/g,'');const wait=!!plainForVoice&&voiceOn&&hosted[n.name]!==false;if(plainForVoice)speak(plainForVoice,n);sayBubble(n,plain,key||'',wait);}
function action(){unlockAudio();if(ride.on){stopRide();return;}if(sitting){standUp();return;}if(nearBench&&!talking){sitDown();return;}if(nearBoard&&!talking){startRide();return;}if(nearN&&!talking)startTalk(nearN);}
/* sitting on the bench: the kid is set on the seat facing the sea and his legs are bent after the animation
   has run; the sun goes down, the stars come out for half a minute, then it brightens again */
let sitting=false,nearBench=false,nightT=null,night=0;const sitOrbit={yaw:0,pitch:0}; /* while seated the controls swing the camera round him instead */const _sq=new THREE.Quaternion(),_sx=new THREE.Vector3(1,0,0);
function sitDown(){if(!BENCH)return;autoTarget=null;autoRoute=[];autoFace=null;v=0;pendingMove=0;up.copy(BENCH.n);fwd.copy(BENCH.face);if(SUNSET){const toSun=SUNSET.base[2].clone().sub(up.clone().multiplyScalar(hAt(up)));toSun.addScaledVector(up,-toSun.dot(up));if(toSun.lengthSq()>1e-6)fwd.copy(toSun);}orthonormalize();sitting=true;sitOrbit.yaw=0;sitOrbit.pitch=0;nightT=performance.now()/1000;$('#ba').textContent='Stand up';$('#ba').classList.remove('off');}
function standUp(){if(!sitting)return;sitting=false;sitPose=null;if(nightT!==null&&performance.now()/1000-nightT<10)nightT=null;moveForward(.9);$('#ba').classList.add('off');shownN=undefined;}
let sitPose=null,sitT0=0;const _sy=new THREE.Vector3(0,1,0),_sq2=new THREE.Quaternion();
/* seated: the whole body is frozen from a snapshot taken as he sits; only the head and neck move, by code:
   a slow look left and right, and every so often a look up at the sky */
function applySit(){if(!sitting||!kidModel)return;const bones=kidModel.userData.bones;if(!bones)return;const S={t:1.45,c:-1.45};
  if(!sitPose){const base=clips.idle?poseFromClip(clips.idle.getClip(),0.2):{};sitPose={};for(const k in bones)sitPose[k]=(base[k]||bones[k].quaternion).clone();sitT0=performance.now()/1000;}
  for(const k in sitPose)bones[k].quaternion.copy(sitPose[k]);
  for(const k of ['L_Thigh','R_Thigh']){const b=bones[k];if(b)b.quaternion.multiply(_sq.setFromAxisAngle(_sx,S.t));}
  for(const k of ['L_Calf','R_Calf']){const b=bones[k];if(b)b.quaternion.multiply(_sq.setFromAxisAngle(_sx,S.c));}
  const t=performance.now()/1000-sitT0,L=window.__look||{yaw:1,pitch:1};
  const yaw=(.4*Math.sin(t*.45)+.18*Math.sin(t*1.1))*L.yaw;const ph=t%13;const upv=smooth(4,5.6,ph)*(1-smooth(8.2,9.8,ph))*.42*L.pitch; /* a look up at the sky every 13 s */
  const head=bones.Head,neck=bones.NeckTwist01;
  if(neck)neck.quaternion.multiply(_sq.setFromAxisAngle(_sy,yaw*.45)).multiply(_sq2.setFromAxisAngle(_sx,upv*.4));
  if(head)head.quaternion.multiply(_sq.setFromAxisAngle(_sy,yaw*.55)).multiply(_sq2.setFromAxisAngle(_sx,upv*.6));}
function updateNight(dt){if(nightT===null){night=Math.max(0,night-dt*.4);}else{const t=performance.now()/1000-nightT-10;night=t<0?0:t<8?smooth(0,8,t):t<38?1:t<46?1-smooth(38,46,t):0;if(t>=46)nightT=null;}
  inkPass.uniforms.night.value=night;if(SUNSET){const drop=night*26;SUNSET.parts.forEach((m,i)=>{m.position.copy(SUNSET.base[i]).addScaledVector(SUNSET.B,-drop);m.material.opacity=(i===0?.6:i===1?.95:1)*(1-night*.9);});
    SUNSET.stars.visible=night>.02;SUNSET.stars.material.opacity=Math.max(0,(night-.3)/.7);}
  shadowCap.material.opacity=.34*(1-night*.85);if(nightDome){nightDome.visible=night>.01;nightDome.material.opacity=night;}
  window.__state=()=>({sitting,sl:+((surfaceAhead(.7)-parkH(up))/.7).toFixed(2),bh:+((parkH(up)-surfaceAhead(-1.5))/1.5).toFixed(2),score:ride.score,combo:ride.combo.length,bal:+ride.bal.toFixed(2),bail:+ride.bail.toFixed(2),manual:ride.manualOn,trick:ride.trick?ride.trick.kind:null,hm:!!HM,h:+parkH(up).toFixed(2),push:+ride.push.toFixed(2),boards:BOARD?BOARD.boards.length:0,riding:ride.on,air:+ride.air.toFixed(2),grind:!!ride.grind,spin:ride.spin,v:+v.toFixed(2),auto:!!autoTarget,route:autoRoute.length,night:+night.toFixed(2)});}
/* skateboarding: hop on the board by the park entrance; push with the arrows, coast with momentum, Space to ollie.
   An ollie next to the rail snaps onto it and grinds to the end; an ollie on the big ramp launches higher and spins a 360. */
const ride={on:false,air:0,airT:0,airDur:0,spin:0,grind:null,pose:null,flip:false,flipped:false,push:0,pushT:0,pushBurst:false,fwHeld:false,legs:1,fwd0:new THREE.Vector3(),camAir:0,tilt:0,tilt0:0,
  trick:null,spinAng:0,spinHold:0,manual:0,manualOn:false,bal:0,bail:0,combo:[],comboT:0,score:0,landed:0};
/* grind lines in park coordinates: the red rail, and the four top edges of the fun box */
const GRINDS=[{x0:RAIL.x0,z0:RAIL.dz,x1:RAIL.x1,z1:RAIL.dz,name:'Rail grind',hOff:RAIL.h},
  {x0:-2.2,z0:-.8,x1:9.8,z1:-.8,name:'Ledge grind'},{x0:-2.2,z0:4.4,x1:9.8,z1:4.4,name:'Ledge grind'},{x0:-2.2,z0:-.8,x1:-2.2,z1:4.4,name:'Ledge grind'},{x0:9.8,z0:-.8,x1:9.8,z1:4.4,name:'Ledge grind'},
  {x0:WRAIL.x0,z0:WRAIL.z,x1:WRAIL.x1,z1:WRAIL.z,name:'Rail grind',hOff:WRAIL.h},{x0:STAIR.x1,z0:0,x1:STAIR.x1+STAIR.steps*STAIR.run,z1:0,name:'Handrail grind',hOff:.9},{x0:ELEDGE.x0,z0:ELEDGE.z,x1:ELEDGE.x1,z1:ELEDGE.z,name:'Ledge grind'}];
const TRICKS={ollie:['Ollie',40],kickflip:['Kickflip',110],heelflip:['Heelflip',110],shoveit:['Pop shove-it',80]};
let trickHide=0;
function showTrick(name,pts){const el=$('#trickname');el.innerHTML=name+(pts?' <small>+'+pts+'</small>':'');el.classList.add('show');trickHide=performance.now()/1000+1.4;}
function addTrick(name,pts){ride.combo.push([name,pts]);ride.comboT=1.1;const mult=ride.combo.length;showTrick(name+(mult>1?'  x'+mult:''),pts);}
function endCombo(bailed){if(!ride.combo.length){ride.combo=[];return;}const base=ride.combo.reduce((a,c)=>a+c[1],0),mult=ride.combo.length;if(!bailed){ride.score+=base*mult;$('#score').textContent=ride.score.toLocaleString();if(mult>1)showTrick(mult+' trick combo',base*mult);}else showTrick('Bailed');ride.combo=[];}
function bail(){if(ride.bail>0)return;ride.bail=1.3;ride.grind=null;ride.manualOn=false;ride.manual=0;ride.air=0;ride.spin=0;ride.trick=null;v=0;endCombo(true);sfx('bail',.8);$('#balance').hidden=true;}
function doTrick(kind){if(!ride.on||ride.bail>0)return;if(kind==='manual'){if(ride.air===0&&!ride.grind&&Math.abs(v)>1.5){ride.manualOn=true;ride.bal=0;}return;}
  if(ride.grind)return;if(ride.air===0){ollie();}if(ride.air===0)return;
  if(kind!=='ollie'&&!ride.trick){ride.trick={kind,t:0,dur:Math.min(.6,ride.airDur*.8)};sfx('flip',.6);}}let nearBoard=null;const _ahead=new THREE.Vector3();
function surfaceAhead(dist){_ahead.copy(up).addScaledVector(fwd,dist/R).normalize();return parkH(_ahead);}
function startRide(){if(!BOARD||ride.on||!nearBoard)return;$('#tricks').hidden=false;$('#jumpbtn').hidden=true;$('#score').hidden=false;$('#score').textContent=ride.score.toLocaleString();if(window.__dbgRide)console.log('STARTRIDE '+new Error().stack.split('\n').slice(1,5).join(' | '));autoTarget=null;autoRoute=[];autoFace=null;ride.on=true;ride.pose=null;ride.air=0;ride.grind=null;scene.remove(nearBoard.prop);BOARD.boards.splice(BOARD.boards.indexOf(nearBoard),1);sceneDirty=true;spawnBoard();BOARD.ride.visible=true;$('#ba').textContent='Hop off';$('#ba').classList.remove('off');firstMove();}
function stopRide(){if(!ride.on)return;endCombo(false);ride.on=false;ride.trick=null;ride.manualOn=false;ride.bail=0;$('#tricks').hidden=true;if(isTouch)$('#jumpbtn').hidden=false;$('#balance').hidden=true;rollVol=0;grindVol=0;ride.grind=null;ride.air=0;ride.pose=null;BOARD.ride.visible=false;const [lon,lat]=lonLatOf(up);dropBoard(up,yawFor(lon,lat,fwd)+Math.PI/2);v=Math.min(v,MAXV);$('#ba').classList.add('off');shownN=undefined;}
function ollie(){if(ride.air>0||ride.grind||ride.bail>0)return;const [dx,dz]=parkXZ(up);sfx('pop',.7);ride.manualOn=false;
  /* an ollie next to a grind line, heading roughly along it, snaps on and grinds */
  const fe=fwd.dot(PARK.east),fn=fwd.dot(PARK.north);let best=null;
  for(const g of GRINDS){const lx=g.x1-g.x0,lz=g.z1-g.z0,L=Math.hypot(lx,lz),ux=lx/L,uz=lz/L;const t=((dx-g.x0)*ux+(dz-g.z0)*uz);if(t<-1||t>L+1)continue;const px=g.x0+ux*t,pz=g.z0+uz*t;const lat_=Math.hypot(dx-px,dz-pz);const along=fe*ux+fn*uz;if(lat_<1.6&&Math.abs(along)>.5&&Math.abs(v)>1&&(!best||lat_<best.lat_))best={g,ux,uz,L,t:clamp(t,0,L),dir:along>0?1:-1,lat_};}
  if(best){ride.grind={g:best.g,ux:best.ux,uz:best.uz,L:best.L,t:best.t,dir:best.dir};ride.bal=0;ride.air=.35;ride.airT=0;ride.airDur=.35;ride.spin=0;addTrick(best.g.name,60);return;}
  ride.airT=0;ride.airDur=.7;ride.air=.9;ride.spin=0;ride.spinAng=0;ride.spinHold=0;ride.landed=0;addTrick('Ollie',TRICKS.ollie[1]);}
function applyRide(){if(!ride.on||!kidModel)return;const bones=kidModel.userData.bones;if(!bones)return;
  if(!ride.pose){const base=clips.idle?poseFromClip(clips.idle.getClip(),0.2):{};ride.pose={};for(const k in bones)ride.pose[k]=(base[k]||bones[k].quaternion).clone();}
  for(const k in ride.pose)bones[k].quaternion.copy(ride.pose[k]);
  ride.legs+=(((ride.air>0||ride.grind)?0:1)-ride.legs)*.18; /* knees bent on the ground, legs straighten in the air */
  const tuck=-(1-ride.legs)*.55; /* negative: straightens the crouch */
  const kick=ride.push*(.5+.5*Math.sin(ride.pushT)); // the back leg swings back to push off the ground, then returns to the board
  if(bones.L_Thigh)bones.L_Thigh.quaternion.multiply(_sq.setFromAxisAngle(_sx,.5+.1*ride.push+.75*tuck));if(bones.L_Calf)bones.L_Calf.quaternion.multiply(_sq.setFromAxisAngle(_sx,-.78-.15*ride.push-1.1*tuck));
  if(bones.R_Thigh)bones.R_Thigh.quaternion.multiply(_sq.setFromAxisAngle(_sx,.5*(1-ride.push)+(-.55+.9*kick)*ride.push+.75*tuck));if(bones.R_Calf)bones.R_Calf.quaternion.multiply(_sq.setFromAxisAngle(_sx,-.78*(1-ride.push)+(-.15-.35*kick)*ride.push-1.1*tuck));
  if(bones.Spine01&&ride.air===0&&!ride.grind){const t=performance.now()/1000;bones.Spine01.quaternion.multiply(_sq.setFromAxisAngle(_sx,.06*Math.sin(t*2.1))).multiply(_sq2.setFromAxisAngle(_sy,.05*Math.sin(t*1.7)));} /* a little sway so he is not stiff */
  if(bones.NeckTwist01)bones.NeckTwist01.quaternion.multiply(_sq.setFromAxisAngle(_sy,-.45));if(bones.Head)bones.Head.quaternion.multiply(_sq.setFromAxisAngle(_sy,-.5));}
function doJump(){if(ride.on){ollie();return;}if(talking||sitting||jump.on)return;jump.on=true;jump.t=0;jump.dur=.62;jumpSfx();firstMove();}
function jumpSfx(){if(!musicOn)return;const c=ensureCtx();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.type='sine';const t=c.currentTime;o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(720,t+.14);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.24);}catch(_){}}
/* the hop: legs tuck up under him at the top of the arc and straighten for the landing */
function applyJump(){if(!jump.on||!kidModel||ride.on)return;const bones=kidModel.userData.bones;if(!bones)return;const bell=Math.sin(Math.PI*clamp(jump.t/jump.dur,0,1));
  for(const k of ['L_Thigh','R_Thigh']){const b=bones[k];if(b)b.quaternion.multiply(_sq.setFromAxisAngle(_sx,.7*bell));}
  for(const k of ['L_Calf','R_Calf']){const b=bones[k];if(b)b.quaternion.multiply(_sq.setFromAxisAngle(_sx,-1.1*bell));}}
function startTalk(n){
  talking=n;n.paused=true;autoTarget=null;for(const k in hold)hold[k]=false;v=0;pendingMove=0;
  autoFace=npcWorld(n).sub(player.group.position).normalize();
  $('#prompt').classList.add('off');$('#ba').classList.add('off');
  $('#chat-name').textContent=n.name;$('#chat-sub').textContent=n.sub;
  chips.innerHTML='';n.chips.forEach(c=>{const b=document.createElement('button');b.type='button';b.textContent=c;b.addEventListener('click',()=>ask(c));chips.appendChild(b);});
  q.value='';chat.classList.remove('off');say(n.greet,n,n.greet);
  if(!isTouch)setTimeout(()=>q.focus(),350);
}
function endTalk(){if(!talking)return;const n=talking;talking=null;n.paused=false;chat.classList.add('off');hideBubbles();stopSpeech();if(typer){clearInterval(typer);typer=null;}game.focus();}
$('#bye').addEventListener('click',endTalk);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function ask(text){unlockAudio();
  const n=talking;if(!n)return;const query=(text||'').trim();if(!query)return;
  q.value='';send.disabled=true;chips.hidden=true;
  meBubble(query);thinkingBubble(n);stopSpeech();
  const pre=ANSWERS[normQ(query)];
  if(pre&&pre.answer){await new Promise(r=>setTimeout(r,900));say(esc(pre.answer),n,pre.answer,pre.key||'');send.disabled=false;chips.hidden=false;return;}
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),58000);
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,mode:'game',sessionId:n.session,who:n.name}),signal:ctrl.signal});
    clearTimeout(to);
    if(r.status===429){const j=await r.json().catch(()=>({}));say(esc(j.error||'That’s all the questions the town can take today. Come back tomorrow.'),n);return;}
    if(!r.ok)throw new Error('bad status');
    const j=await r.json();const answer=(j.answer||'').trim();const key=(j.key||'').trim();
    if(!answer)throw new Error('empty');
    say(esc(answer),n,answer,key);
  }catch(e){
    clearTimeout(to);
    const msg=e.name==='AbortError'?'Sorry, that took too long. Ask me again?':'I can’t reach my notes from here. The planet needs to be hosted alongside the chatbot for me to answer.';
    say(esc(msg),n,msg);
  }finally{send.disabled=false;chips.hidden=false;}
}
$('#ask').addEventListener('submit',e=>{e.preventDefault();ask(q.value);});
})();
