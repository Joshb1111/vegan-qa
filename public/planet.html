<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>The Planet — Understand Veganism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Karla:wght@400;700&display=swap">
<style>
:root{--ink:#26333a;--cream:#f3efe4;--cream2:#e6e0cf;--teal:#8fc7c2;--teal2:#6fb3ad;--green:#b9cf9a;--green2:#8fb07a;--grey:#c9cec8;--grey2:#a9b0ac;--orange:#e8792b;--red:#c8402f;--muted:#5f6d72;--hand:"Patrick Hand","Segoe Print","Bradley Hand",cursive;--body:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8fc7c2;font-family:var(--body);color:var(--ink);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
#game{position:fixed;inset:0;outline:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#c.drag{cursor:grabbing}
.ink{background:var(--cream);border:2.5px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink)}
button.ink:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* ---------- HUD ---------- */
#hint{position:absolute;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);font-family:var(--hand);font-size:19px;background:rgba(243,239,228,.85);padding:4px 14px;border-radius:999px;pointer-events:none;white-space:nowrap;transition:opacity .8s}
#hint.gone{opacity:0}
#prompt{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);max-width:calc(100vw - 150px);padding:8px 18px 6px;text-align:center;pointer-events:none;transition:opacity .2s,transform .2s}
#prompt.off{opacity:0;transform:translate(-50%,-8px)}
#prompt b{display:block;font-family:var(--hand);font-weight:normal;font-size:23px;line-height:1.1}
#prompt span{color:var(--muted);font-size:13px}
#pad{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;gap:12px}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px}
.dpad .dir{appearance:none;width:58px;height:58px;font-size:20px;cursor:pointer;touch-action:none;padding:0}
.dpad [data-k=u]{grid-column:2;grid-row:1}.dpad [data-k=l]{grid-column:1;grid-row:2}.dpad [data-k=d]{grid-column:2;grid-row:2}.dpad [data-k=r]{grid-column:3;grid-row:2}
.dpad .dir.down{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);background:var(--cream2)}
#ba{appearance:none;min-width:140px;height:58px;margin-bottom:2px;font-family:var(--hand);font-size:24px;background:var(--orange);color:var(--cream);cursor:pointer;transition:opacity .2s,transform .2s;padding:0 22px 2px}
#ba.off{opacity:0;transform:scale(.9);pointer-events:none}
@media (hover:hover) and (pointer:fine){.dpad .dir{opacity:.75}}
#menubtn{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;width:52px;height:52px;appearance:none;cursor:pointer;padding:0;display:grid;place-items:center}
#menubtn svg{width:30px;height:30px}
#stops{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 62px);right:14px;width:min(300px,calc(100vw - 28px));padding:10px;z-index:5;max-height:70vh;overflow:auto}
#stops[hidden]{display:none}
#stops h2{margin:2px 6px 8px;font-family:var(--hand);font-weight:normal;font-size:24px}
#stops button{appearance:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:2px dashed var(--grey2);padding:8px 6px;font-family:var(--hand);font-size:21px;cursor:pointer;line-height:1.1}
#stops button:first-of-type{border-top:0}
#stops button:hover{background:var(--cream2)}
#stops button i{width:22px;height:22px;border:2px solid var(--ink);border-radius:50%;flex:none}
#stops button small{margin-left:auto;font-family:var(--body);font-size:12px;color:var(--muted)}
@media (max-width:420px){#ba{min-width:112px;height:54px;font-size:21px;padding:0 14px 2px}}

/* ---------- title card ---------- */
#title{position:fixed;inset:0;background:var(--cream);display:grid;place-items:center;z-index:20;transition:opacity .5s;cursor:pointer}
#title.gone{opacity:0;pointer-events:none}
#title .tcard{text-align:center;padding:24px;max-width:560px}
#title svg{width:150px;height:150px;display:block;margin:0 auto 8px}
#title h1{font-family:var(--hand);font-weight:normal;font-size:clamp(34px,7vw,54px);margin:0;letter-spacing:.06em;text-transform:uppercase;line-height:1}
#title p{font-family:var(--hand);font-size:22px;margin:10px 0 0;color:var(--muted);line-height:1.25}
#title p b{color:var(--ink);font-weight:normal}
#title p.err{color:var(--red)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#title svg{animation:bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){#title svg{animation:none}}

/* ---------- talking to someone ---------- */
#chat{position:fixed;left:50%;bottom:0;transform:translate(-50%,0);width:min(680px,100vw);max-height:min(62vh,520px);display:flex;flex-direction:column;z-index:10;border-radius:14px 14px 0 0;border-bottom:0;box-shadow:0 -4px 0 var(--ink);transition:transform .3s;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
#chat.off{transform:translate(-50%,110%)}
#chat header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
#chat header b{font-family:var(--hand);font-weight:normal;font-size:26px;line-height:1}
#chat header small{color:var(--muted);font-size:13px}
#chat header .sp{flex:1}
#chat header button{appearance:none;padding:4px 12px 2px;font-family:var(--hand);font-size:19px;cursor:pointer;white-space:nowrap}
@media (max-width:420px){#chat header b{font-size:22px}#chat header small{display:none}#chat header button{font-size:17px;padding:3px 9px 1px}}
#chat header button[aria-pressed=false]{background:var(--cream2);color:var(--muted)}
#bubble{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.5;overflow:auto;max-height:26vh;flex:1 1 auto;min-height:56px;position:relative;min-height:56px}
#bubble:before{content:"";position:absolute;left:28px;top:-13px;width:18px;height:18px;background:#fff;border-left:2.5px solid var(--ink);border-top:2.5px solid var(--ink);transform:rotate(45deg)}
#bubble .key{display:block;margin-top:10px;padding-top:8px;border-top:2px dashed var(--grey2);font-family:var(--hand);font-size:19px;line-height:1.25}
#bubble .thinking{color:var(--muted);font-style:italic}
#chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px;flex:none}
@media (max-height:520px){#chips{display:none}#chat .note{display:none}}
#chips button{appearance:none;background:var(--cream2);border:2px solid var(--ink);border-radius:999px;padding:5px 12px 3px;font-family:var(--hand);font-size:17px;cursor:pointer;line-height:1.1}
#chips button:hover{background:#fff}
#ask{display:flex;gap:8px;margin-top:10px}
#q{flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 12px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
#q:focus{outline:3px solid var(--teal2);outline-offset:1px}
#send{appearance:none;padding:0 18px;font-family:var(--hand);font-size:22px;background:var(--orange);color:var(--cream);cursor:pointer}
#send:disabled{opacity:.6;cursor:default}
#chat .note{margin:8px 0 0;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="game" tabindex="0" aria-label="A small town on a round planet, seen from behind the walker. Use the arrow keys to walk; walk up to someone to ask them a question.">
  <canvas id="c"></canvas>
  <div id="hint">↑ ↓ to walk · ← → to turn · walk up to someone</div>
  <div id="prompt" class="off ink"><b></b><span></span></div>
  <button id="menubtn" class="ink" type="button" aria-label="People" aria-expanded="false"><svg viewBox="0 0 30 30" fill="none" stroke="#26333a" stroke-width="2.6" stroke-linecap="round"><path d="M9 8h15M9 15h15M9 22h15"/><circle cx="4.5" cy="8" r="1.4" fill="#26333a"/><circle cx="4.5" cy="15" r="1.4" fill="#26333a"/><circle cx="4.5" cy="22" r="1.4" fill="#26333a"/></svg></button>
  <nav id="stops" class="ink" hidden aria-label="People on the planet"><h2>People</h2></nav>
  <div id="pad">
    <button id="ba" class="off ink" type="button">Talk</button>
    <div class="dpad" aria-label="Walk">
      <button class="dir ink" type="button" data-k="u" aria-label="Walk forward">▲</button>
      <button class="dir ink" type="button" data-k="l" aria-label="Turn left">◀</button>
      <button class="dir ink" type="button" data-k="d" aria-label="Walk back">▼</button>
      <button class="dir ink" type="button" data-k="r" aria-label="Turn right">▶</button>
    </div>
  </div>
</div>
<section id="chat" class="ink off" aria-live="polite">
  <header><b id="chat-name">Someone</b><small id="chat-sub"></small><span class="sp"></span><button type="button" class="ink" id="voice" aria-pressed="true">Voice on</button><button type="button" class="ink" id="bye">Bye</button></header>
  <div id="bubble"></div>
  <div id="chips"></div>
  <form id="ask" autocomplete="off"><input id="q" type="text" maxlength="300" placeholder="Ask anything about veganism…" aria-label="Your question"><button id="send" class="ink" type="submit">Ask</button></form>
  <p class="note">Answers come from the Understand Veganism chatbot.</p>
</section>
<div id="title" role="button" aria-label="Start">
  <div class="tcard">
    <svg viewBox="0 0 150 150" fill="none" stroke="#26333a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="75" cy="112" r="62" fill="#b9cf9a"/>
      <path d="M13 112a62 62 0 0 0 124 0" fill="#7b9597"/>
      <path d="M22 112h106" stroke="#f3efe4" stroke-dasharray="8 7"/>
      <path d="M40 52v-24h30v24" fill="#f3efe4"/><path d="M36 30l19-14 19 14z" fill="#c8785a"/>
      <path d="M80 52v-34h26v34" fill="#cfd8b8"/><path d="M84 24h6v6h-6zM94 24h6v6h-6zM84 36h6v6h-6zM94 36h6v6h-6z" fill="#9fd0cb"/>
      <circle cx="120" cy="44" r="6" fill="#f2cfae"/><path d="M114 40a6 6 0 0 1 12 0" fill="#2a2430"/><path d="M115 52h10v14h-10z" fill="#e8792b"/><path d="M116 66h8v7h-8z" fill="#c8402f"/>
      <circle cx="26" cy="46" r="6" fill="#f2cfae"/><path d="M20 42a6 6 0 0 1 12 0" fill="#5a3b2a"/><path d="M21 54h10v14h-10z" fill="#4f86b3"/><path d="M22 68h8v7h-8z" fill="#26333a"/>
    </svg>
    <h1>Understand<br>Veganism</h1>
    <p id="title-p">a hillside town above the bay<br><b>&uarr; &darr;</b> to walk, <b>&larr; &rarr;</b> to turn<br>walk up to anyone and <b>ask them a question</b></p>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
if(!window.THREE){$('#title-p').className='err';$('#title-p').textContent='The 3D library could not load. Check the connection and reload.';return;}
const API='/api/ask';
const ANSWERS={};
fetch('planet-answers.json').then(r=>r.ok?r.json():{}).then(j=>Object.assign(ANSWERS,j)).catch(()=>{});
const normQ=q=>q.toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').trim();

const P={ink:0x26333a,sky:0x8fc7c2,cream:0xf3efe4,cream2:0xe6e0cf,green:0xb9cf9a,green2:0x8fb07a,green3:0x6d905a,grey:0xc9cec8,grey2:0xa9b0ac,concrete:0xbfbcb0,orange:0xe8792b,red:0xc8402f,skin:0xf2cfae,hair:0x2a2430,blue:0x4f86b3,glass:0x9fd0cb,wood:0x7d6540,yellow:0xf3d24a,terracotta:0xc8785a,slate:0x5f7e8c,sea:0x5fb0bc,hoodie:0x2d2f3a,khaki:0xb9a66e};
const WALLS=[0xf3efe4,0xcfd8b8,0xc4ccd0,0xd8d2c4,0xe7d5cd,0xf6f4ee,0xd9cfb0,0xe9e3d3,0xbfc7c9];
const ROOFS=[0x8fb07a,0xc8785a,0x5f7e8c,0x7d6540,0x6d905a,0x9aa7a8];

/* =====================================================================
   SCENE
   ===================================================================== */
const game=$('#game'), canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x86c8c6);
const camera=new THREE.PerspectiveCamera(50,1,0.1,1500); scene.add(camera);
const sun=new THREE.DirectionalLight(0xffffff,0.55); sun.position.set(4,7,3); camera.add(sun); sun.target.position.set(0,0,-10); camera.add(sun.target);
scene.add(new THREE.AmbientLight(0xffffff,0.36));
let W=0,H=0;
function resize(){W=game.clientWidth;H=game.clientHeight;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
let seed=9;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const pick=a=>a[Math.floor(rnd()*a.length)];

/* ---------- toon + ink helpers ---------- */
const grad=(()=>{const d=new Uint8Array([150,150,150,255,205,205,205,255,255,255,255,255]);const t=new THREE.DataTexture(d,3,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;})();
const matCache=new Map();
const toon=(c,extra)=>{if(extra)return new THREE.MeshToonMaterial(Object.assign({color:c,gradientMap:grad},extra));if(!matCache.has(c))matCache.set(c,new THREE.MeshToonMaterial({color:c,gradientMap:grad}));return matCache.get(c);};
const inkMat=new THREE.MeshBasicMaterial({color:P.ink,side:THREE.BackSide});
const O=0.045;
function outlined(geo,mat,dims){const g=new THREE.Group();g.add(new THREE.Mesh(geo,mat));const o=new THREE.Mesh(geo,inkMat);o.scale.set((dims[0]+2*O)/dims[0],(dims[1]+2*O)/dims[1],(dims[2]+2*O)/dims[2]);g.add(o);return g;}
const box=(w,h,d,c)=>outlined(new THREE.BoxGeometry(w,h,d),toon(c),[w,h,d]);
const plain=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),toon(c));
const sph=(r,c,seg)=>outlined(new THREE.SphereGeometry(r,seg||16,seg?Math.ceil(seg*.7):11),toon(c),[2*r,2*r,2*r]);
const cyl=(rt,rb,h,c,seg)=>outlined(new THREE.CylinderGeometry(rt,rb,h,seg||12),toon(c),[2*Math.max(rt,rb),h,2*Math.max(rt,rb)]);
const pcyl=(rt,rb,h,c,seg)=>new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||10),toon(c));
const cone=(r,h,c,seg)=>outlined(new THREE.ConeGeometry(r,h,seg||12),toon(c),[2*r,h,2*r]);
function prism(w,h,d,c){const s=new THREE.Shape();s.moveTo(-d/2,0);s.lineTo(d/2,0);s.lineTo(0,h);s.closePath();const geo=new THREE.ExtrudeGeometry(s,{depth:w,bevelEnabled:false});const g=outlined(geo,toon(c),[d,h,w]);g.rotation.y=Math.PI/2;g.position.x=-w/2;const wrap=new THREE.Group();wrap.add(g);return wrap;}
const at=(obj,x,y,z)=>{obj.position.set(x,y,z);return obj;};
function label(text,w,h,bg,fg,size,opts){const o=opts||{};const cv=document.createElement('canvas');const px=110;cv.width=Math.round(w*px);cv.height=Math.round(h*px);const g=cv.getContext('2d');
  g.fillStyle=bg;g.fillRect(0,0,cv.width,cv.height);if(o.border!==false){g.strokeStyle='#26333a';g.lineWidth=px*0.03;g.strokeRect(g.lineWidth/2,g.lineWidth/2,cv.width-g.lineWidth,cv.height-g.lineWidth);}
  g.fillStyle=fg;g.font=(o.bold?'700 ':'')+Math.round((size||h*.6)*px)+'px "Patrick Hand","Segoe Print",cursive';g.textAlign='center';g.textBaseline='middle';g.fillText(text,cv.width/2,cv.height/2+px*0.02);
  const t=new THREE.CanvasTexture(cv);t.anisotropy=4;return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t}));}
function poster(){const w=.7+rnd()*.5,h=.9+rnd()*.5;const cv=document.createElement('canvas');cv.width=80;cv.height=100;const g=cv.getContext('2d');const bg=pick(['#9fd0cb','#f3efe4','#e8792b','#f3d24a','#e7d5cd']);g.fillStyle=bg;g.fillRect(0,0,80,100);g.fillStyle='#26333a';for(let i=0;i<4;i++)g.fillRect(12,18+i*18,56-rnd()*30,4);g.strokeStyle='#26333a';g.lineWidth=3;g.strokeRect(1.5,1.5,77,97);
  const t=new THREE.CanvasTexture(cv);return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t}));}

/* =====================================================================
   TERRAIN — terraces stepping down to the sea (south, +z). Heights are analytic so walking is exact.
   ===================================================================== */
const MAP=84; // half-size
const STEPS=[{z:38,lo:0,hi:3.2},{z:8,lo:3.2,hi:6.4},{z:-24,lo:6.4,hi:9.6}]; // wall lines (north side is higher)
const ROADZ=[46,20,-8,-40]; // one street per terrace
const RW=9; // ramp half-length along z
const RAMPS=[{x:-46,s:0,stairs:false},{x:16,s:0,stairs:true},{x:58,s:0,stairs:false},{x:-14,s:1,stairs:true},{x:40,s:1,stairs:false},{x:-60,s:1,stairs:true},{x:6,s:2,stairs:false},{x:-40,s:2,stairs:true},{x:52,s:2,stairs:true}];
function level(z){for(const s of STEPS){if(z>s.z)return s.lo;}return STEPS[STEPS.length-1].hi;}
function terraceOf(z){for(let i=0;i<STEPS.length;i++)if(z>STEPS[i].z)return i;return STEPS.length;}
function rampAt(x,z){for(const r of RAMPS){const s=STEPS[r.s];if(Math.abs(x-r.x)<4.5&&z>s.z-RW&&z<=s.z+RW)return {r,s};}return null;}
function h(x,z){const ra=rampAt(x,z);if(ra){const {s}=ra;const t=(z-(s.z-RW))/(2*RW);return s.hi+(s.lo-s.hi)*t;}return level(z);}
const colliders=[]; // meshes the camera may not look through
const blocks=[]; // {x0,x1,z0,z1} the walker may not enter
(function makeGround(){
  const N=168;const geo=new THREE.PlaneGeometry(MAP*2,MAP*2,N,N);geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;const col=new Float32Array(pos.count*3);const c=new THREE.Color();
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);pos.setY(i,h(x,z));
    let hex=P.concrete;const t=terraceOf(z);const rz=ROADZ[t];
    if(Math.abs(z-rz)<3.2)hex=0x6f8a8c;else if(Math.abs(z-rz)<5.4)hex=0xb3b7b1;
    else if(rampAt(x,z))hex=0x6f8a8c;
    else if(rnd()<.08)hex=0xb5b3a6;else if(rnd()<.05)hex=0xa9c68f;
    c.setHex(hex);const v=1-rnd()*.04;col[i*3]=c.r*v;col[i*3+1]=c.g*v;col[i*3+2]=c.b*v;}
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo,toon(0xffffff,{vertexColors:true})));
  // road centre lines
  for(let t=0;t<ROADZ.length;t++){for(let x=-MAP+2;x<MAP-2;x+=4){const m=plain(2,.02,.16,P.cream);m.position.set(x,h(x,ROADZ[t])+.03,ROADZ[t]);scene.add(m);}}
  // sea and far ground
  const sea=new THREE.Mesh(new THREE.PlaneGeometry(2400,2400),new THREE.MeshBasicMaterial({color:P.sea}));sea.rotation.x=-Math.PI/2;sea.position.y=-6;scene.add(sea);
  const hill=new THREE.Mesh(new THREE.PlaneGeometry(2400,900),toon(0x8fb07a));hill.rotation.x=-Math.PI/2;hill.position.set(0,9.6,-MAP-450);scene.add(hill);
})();
// retaining walls with parapets, leaving gaps for the ramps; stairs and railings on the stair ramps
(function makeWalls(){
  for(let si=0;si<STEPS.length;si++){const s=STEPS[si];const gaps=RAMPS.filter(r=>r.s===si).map(r=>r.x).sort((a,b)=>a-b);
    let x=-MAP;for(const gx of [...gaps,MAP+20]){const x1=Math.min(gx-4.7,MAP);if(x1-x>1){const len=x1-x;const wh=(s.hi-s.lo)+.9;const w=box(len,wh,.7,pick([0xc9cec8,0xb9bdb8,0xc4bfb2,0xd0cbbd]));w.position.set((x+x1)/2,s.lo+wh/2,s.z);scene.add(w);colliders.push(w);
        for(let px=x+1.5;px<x1-1;px+=6)if(rnd()<.35){const pl=planterBox();pl.position.set(px,s.hi+.9,s.z);scene.add(pl);}}
      x=gx+4.7;}
  }
  for(const r of RAMPS){const s=STEPS[r.s];const rise=s.hi-s.lo;

const npcSpots=[];
function place(obj,x,z,yaw){obj.position.set(x,h(x,z),z);obj.rotation.y=yaw||0;scene.add(obj);obj.updateMatrixWorld(true);return obj;}
function placeBuilding(b,x,z,w,d,yaw){place(b,x,z,yaw);colliders.push(b);const hw=w/2+.5,hd=d/2+.5;blocks.push({x0:x-hw,x1:x+hw,z0:z-hd,z1:z+hd});}
(function buildTown(){
  for(let t=0;t<ROADZ.length;t++){const rz=ROADZ[t];const zNorthLimit=t<STEPS.length?STEPS[t].z:-MAP+4; // wall line north of this terrace's road? (walls: STEPS[t].z is the north wall of terrace t)
    const northWall=t<STEPS.length?STEPS[t].z:-MAP+6; const southEdge=t>0?STEPS[t-1].z:MAP-6;
    for(const side of [-1,1]){ // -1 = north of the street (faces south), +1 = south of the street (faces north)
      let x=-MAP+4+rnd()*3;
      while(x<MAP-8){
        const w=6+rnd()*6,d=4.5+rnd()*2.5;
        const clear=RAMPS.some(r=>Math.abs(r.x-(x+w/2))<w/2+5.5&&(r.s===t||r.s===t-1));
        const step=w+1.5+rnd()*3;
        if(!clear){
          let z;if(side<0){z=rz-5.5-d/2;if(z-d/2<northWall+1.2)z=northWall+1.2+d/2;}else{z=rz+5.5+d/2;if(z+d/2>southEdge-1.2)z=southEdge-1.2-d/2;}
          const room=side<0?(rz-5.5)-(northWall+1.2):(southEdge-1.2)-(rz+5.5);
          if(room>d){const tt=rnd();let b=null;if(tt<.28)b=house(w,d);else if(tt<.56)b=block(w,d);else if(tt<.82)b=shop(w,d);else if(tt<.9)b=greenHouse(w,d);
            if(b){placeBuilding(b,x+w/2,z,w,d,side<0?0:Math.PI);}
            else{const wl=box(w,1,.35,pick([P.cream2,P.grey]));place(wl,x+w/2,side<0?rz-5.6:rz+5.6,0);const tr=tree(Math.floor(rnd()*3));place(tr,x+w/2,z);colliders.push(tr);npcSpots.push({x:x+w/2,z:rz+side*4.4,yaw:side<0?Math.PI:0});}}
        }
        // pavement furniture in the gap after the plot
        const gx=x+step-1.1,gz=rz+side*4.3,pr=rnd();
        if(pr<.16){const p=pole();place(p,gx,gz);colliders.push(p);}
        else if(pr<.26){place(streetLamp(),gx,gz,side<0?Math.PI/2:-Math.PI/2);}
        else if(pr<.34){place(roundSign(pick([P.red,P.blue]),pick(['↑','30','P','!'])),gx,gz);}
        else if(pr<.44){const v=vend();place(v,gx,rz+side*4.7,side<0?0:Math.PI);colliders.push(v);npcSpots.push({x:gx+1.5,z:gz,yaw:side<0?0:Math.PI});}
        else if(pr<.5){place(bin(),gx,gz);}
        else if(pr<.58){place(bench(),gx,rz+side*4.8,side<0?0:Math.PI);npcSpots.push({x:gx,z:rz+side*4.4,yaw:side<0?Math.PI:0});}
        else if(pr<.66){place(mirror(),gx,gz);}
        else if(pr<.76){const tr=tree(Math.floor(rnd()*3));place(tr,gx,rz+side*5);colliders.push(tr);}
        else if(pr<.84){place(hedge(2+rnd()*2),gx,rz+side*4.9);}
        x+=step;
      }
    }
    for(let i=0;i<4;i++)place(manhole(),-MAP+10+rnd()*(2*MAP-20),rz+(rnd()-.5)*3);
  }
  // guard rails along the sea edge and a few hillside trees
  for(let x=-MAP+2;x<MAP-2;x+=12){const g=guardrail(11.5);place(g,x+5.75,MAP-3);}
  for(let i=0;i<14;i++){const tr=tree(Math.floor(rnd()*3));place(tr,-MAP+rnd()*2*MAP,-MAP+2+rnd()*10);}
  // wires between telephone poles on the same street
  const tops=[];for(const c of colliders){if(c.children.length===7&&c.children[0].children&&c.children[0].children.length===2){const t=c.localToWorld(new THREE.Vector3(0,6.6,0));tops.push(t);}}
  const mat=new THREE.LineBasicMaterial({color:P.ink});
  for(let i=0;i<tops.length;i++)for(let j=i+1;j<tops.length;j++){const a=tops[i],b=tops[j];if(Math.abs(a.z-b.z)>2||Math.abs(a.x-b.x)>40||Math.abs(a.x-b.x)<3)continue;
    for(const off of [0,-.5]){const p0=a.clone(),p1=b.clone();p0.y+=off;p1.y+=off;const mid=p0.clone().add(p1).multiplyScalar(.5);mid.y-=1.2;scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(new THREE.QuadraticBezierCurve3(p0,mid,p1).getPoints(14)),mat));}}
})();

['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,endDrag));
$$('.dpad .dir').forEach(el=>{const key=el.dataset.k;const on=e=>{e.preventDefault();hold[key]=true;el.classList.add('down');try{el.setPointerCapture(e.pointerId)}catch(_){}};const off=()=>{hold[key]=false;el.classList.remove('down');};
  el.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,off));el.addEventListener('contextmenu',e=>e.preventDefault());});
$('#ba').addEventListener('click',()=>action());
game.addEventListener('pointerdown',()=>game.focus());game.focus();
let titleGone=false;
function dismissTitle(){if(titleGone)return;titleGone=true;$('#title').classList.add('gone');game.focus();}
$('#title').addEventListener('click',dismissTitle);
function toggleStops(show){const s=$('#stops');const vis=show==null?s.hidden:show;s.hidden=!vis;$('#menubtn').setAttribute('aria-expanded',String(vis));}
$('#menubtn').addEventListener('click',e=>{e.stopPropagation();toggleStops();});
$('#stops').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;const n=npcs.find(x=>x.id===b.dataset.go);autoTarget={npc:n,retarget:0,stuck:0};route=null;autoFace=null;firstMove();toggleStops(false);});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#stops,#menubtn'))toggleStops(false);});

/* =====================================================================
   TALKING — questions go to the chatbot; answers are shown and spoken
   ===================================================================== */
const chat=$('#chat'),bubble=$('#bubble'),chips=$('#chips'),q=$('#q'),send=$('#send');
let voiceOn=true;try{voiceOn=localStorage.getItem('planet-voice')!=='off';}catch(_){}
const canSpeak='speechSynthesis' in window;
if(!canSpeak){$('#voice').hidden=true;voiceOn=false;}
$('#voice').setAttribute('aria-pressed',String(voiceOn));$('#voice').textContent=voiceOn?'Voice on':'Voice off';
$('#voice').addEventListener('click',()=>{voiceOn=!voiceOn;$('#voice').setAttribute('aria-pressed',String(voiceOn));$('#voice').textContent=voiceOn?'Voice on':'Voice off';try{localStorage.setItem('planet-voice',voiceOn?'on':'off');}catch(_){}if(!voiceOn&&canSpeak)speechSynthesis.cancel();});
function pickVoice(n){if(!canSpeak)return null;const vs=speechSynthesis.getVoices();const en=vs.filter(v=>/^en/i.test(v.lang));if(!en.length)return null;const i=npcs.indexOf(n);if(n.voiceWish){const w=en.find(v=>v.name.startsWith(n.voiceWish));if(w)return w;}const gb=en.filter(v=>/en-GB/i.test(v.lang));const pool=gb.length>=3?gb:en;return pool[(i*5+2)%pool.length];}
function speak(text,n){if(!canSpeak||!voiceOn)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const vc=pickVoice(n);if(vc)u.voice=vc;u.rate=n.rate||1;u.pitch=n.pitch||1;speechSynthesis.speak(u);}
if(canSpeak)speechSynthesis.onvoiceschanged=()=>{};
let typer=null;
function say(html,n,plainForVoice){if(typer){clearInterval(typer);typer=null;}bubble.innerHTML='';const span=document.createElement('span');bubble.appendChild(span);let i=0;
  typer=setInterval(()=>{i+=3;span.innerHTML=html.slice(0,i);bubble.scrollTop=bubble.scrollHeight;if(i>=html.length){clearInterval(typer);typer=null;span.innerHTML=html;}},22);if(plainForVoice)speak(plainForVoice,n);}
function action(){if(nearN&&!talking)startTalk(nearN);}
function startTalk(n){talking=n;n.paused=true;autoTarget=null;route=null;for(const k in hold)hold[k]=false;v=0;pendingMove=0;autoFace={x:n.x,z:n.z};
  $('#prompt').classList.add('off');$('#ba').classList.add('off');$('#chat-name').textContent=n.name;$('#chat-sub').textContent=n.sub;
  chips.innerHTML='';n.chips.forEach(c=>{const b=document.createElement('button');b.type='button';b.textContent=c;b.addEventListener('click',()=>ask(c));chips.appendChild(b);});
  q.value='';chat.classList.remove('off');say(n.greet,n,n.greet);if(!isTouch)setTimeout(()=>q.focus(),350);}
function endTalk(){if(!talking)return;const n=talking;talking=null;n.paused=false;chat.classList.add('off');if(canSpeak)speechSynthesis.cancel();if(typer){clearInterval(typer);typer=null;}game.focus();}
$('#bye').addEventListener('click',endTalk);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function ask(text){const n=talking;if(!n)return;const query=(text||'').trim();if(!query)return;
  q.value='';send.disabled=true;chips.hidden=true;bubble.innerHTML='<span class="thinking">'+esc(n.name)+' thinks about it…</span>';if(canSpeak)speechSynthesis.cancel();
  const pre=ANSWERS[normQ(query)];
  if(pre&&pre.answer){await new Promise(r=>setTimeout(r,500));let html=esc(pre.answer).replace(/\n\n+/g,'<br><br>').replace(/\n/g,'<br>');if(pre.key)html+='<span class="key">'+esc(pre.key)+'</span>';say(html,n,pre.answer);send.disabled=false;chips.hidden=false;return;}
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),58000);
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,mode:'game',sessionId:n.session}),signal:ctrl.signal});clearTimeout(to);
    if(r.status===429){const j=await r.json().catch(()=>({}));say(esc(j.error||'That’s all the questions the town can take today. Come back tomorrow.'),n);return;}
    if(!r.ok)throw new Error('bad status');const j=await r.json();const answer=(j.answer||'').trim();const key=(j.key||'').trim();if(!answer)throw new Error('empty');
    let html=esc(answer).replace(/\n\n+/g,'<br><br>').replace(/\n/g,'<br>');if(key)html+='<span class="key">'+esc(key)+'</span>';say(html,n,answer);
  }catch(e){clearTimeout(to);const msg=e.name==='AbortError'?'Sorry, that took too long. Ask me again?':'I can’t reach my notes right now. Try again in a moment.';say(esc(msg),n,msg);}
  finally{send.disabled=false;chips.hidden=false;}}
$('#ask').addEventListener('submit',e=>{e.preventDefault();ask(q.value);});
})();
</script>
</body>
</html>
