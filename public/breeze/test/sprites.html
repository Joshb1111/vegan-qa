<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berry Breeze sprites</title>
<style>
body{margin:0;background:#efeaf8;font:13px system-ui,sans-serif;color:#2b2140}
header{position:sticky;top:0;z-index:2;background:#2b2140;color:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header button{font:inherit;padding:4px 10px;border-radius:8px;border:0;background:#ffd93b;color:#2b2140;font-weight:700;cursor:pointer}
header button.on{background:#9be8c4}#info{opacity:.9}
h2{margin:18px 12px 6px;font-size:15px}canvas{display:block;margin:0 12px;border-radius:10px}
</style></head><body>
<header><b>Berry Breeze · art contact sheet</b>
<button data-r="2">R 2</button><button data-r="3">R 3</button><button data-r="4">R 4</button>
<button id="perf">Perf test (200 frames, R 2 + R 3)</button><span id="info"></span></header>
<div id="out"></div>
<script src="../content.js"></script>
<script src="../art.js"></script>
<script>
'use strict';
const A = BB.Art, out = document.getElementById('out'), info = document.getElementById('info');
const Q = new URLSearchParams(location.search);
let R = +Q.get('R') || 3; const ZOOM = +Q.get('zoom') || 0;
const CV = {};
function section(id, title, w, h, bg, draw) {
  let wrap = document.getElementById('s-' + id);
  if (!wrap) { wrap = document.createElement('div'); wrap.id = 's-' + id; wrap.innerHTML = '<h2>' + title + '</h2>'; wrap.appendChild(document.createElement('canvas')); out.appendChild(wrap); }
  const c = wrap.querySelector('canvas'); c.width = Math.ceil(w * R); c.height = Math.ceil(h * R);
  const css = ZOOM || Math.max(1.5, R / (devicePixelRatio || 1)); c.style.width = w * css + 'px'; c.style.height = h * css + 'px';
  const ctx = c.getContext('2d'); ctx.setTransform(R, 0, 0, R, 0, 0); ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
  draw(ctx); CV[id] = c; return c;
}
const label = (ctx, s, x, y) => { ctx.font = '600 7px system-ui'; ctx.fillStyle = '#4a3a6b'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(s, x, y); };
function panel(ctx, px, py, draw) { ctx.save(); ctx.translate(px, py); ctx.beginPath(); ctx.rect(0, 0, 240, 320); ctx.clip(); draw(ctx); ctx.restore(); ctx.strokeStyle = '#2b2140'; ctx.lineWidth = 1; ctx.strokeRect(px, py, 240, 320); }

/* a full in-game frame: used by the panels and the perf test */
function scene(ctx, st, t, o) {
  o = o || {}; const s = t * 0.4;
  A.bg(ctx, st, s, t, { calm: o.calm || 0 });
  const E = o.enemies || [];
  for (const e of E) if (e.ground) A.enemy(ctx, e.type, e.x, e.y, { a: e.a || 0, t: t + e.x | 0, flash: e.flash, hpf: 1 });
  for (const f of o.fruit || []) A.fruit(ctx, f.k, f.x, f.y, { t: t + f.x | 0, h: f.h || 0, squash: f.sq || 0 });
  for (const e of E) if (!e.ground) A.enemy(ctx, e.type, e.x, e.y, { a: e.a || 0, t: t + (e.boss ? 0 : e.x | 0), flash: e.flash, hpf: e.hpf == null ? 1 : e.hpf });
  for (const sh of o.shots || []) A.shot(ctx, sh.k || 'p', sh.x, sh.y, sh.ang == null ? -Math.PI / 2 : sh.ang, t, sh.who || 0);
  for (const b of o.buddies || []) A.buddy(ctx, b.who, b.x, b.y, t);
  for (const p of o.ships || []) A.ship(ctx, p.who, p.x, p.y, Object.assign({ t }, p));
  for (const b of o.bullets || []) A.bullet(ctx, b.x, b.y, b.big, t + (b.x | 0));
  for (const f of o.fx || []) A.fx(ctx, f, f.age);
  if (o.hud) A.hud(ctx, Object.assign({ t }, o.hud));
}
function busy(st) {
  const rnd = BB.mulberry32(7 + st), types = [['smudge', 'glider', 'tinbot', 'grumble', 'twirlie', 'ticktock', 'smudge', 'glider'], ['glider', 'twirlie', 'smudge', 'grumble', 'tinbot', 'ticktock', 'grumblet', 'smudge'], ['tinbot', 'twirlie', 'grumble', 'ticktock', 'smudge', 'glider', 'tinbot', 'twirlie']][st];
  const enemies = [];
  for (let i = 0; i < 12; i++) enemies.push({ type: types[i % types.length], x: 20 + rnd() * 200, y: 30 + rnd() * 160, a: i % 5 === 0 ? 1 : 0 });
  enemies.push({ type: 'vent', x: 50, y: 230, ground: 1 }, { type: 'boinger', x: 190, y: 200, ground: 1, a: 1 }, { type: 'bush', x: 120, y: 120 }, { type: 'present', x: 210, y: 260, ground: 1 });
  const bullets = []; for (let i = 0; i < 36; i++) bullets.push({ x: 10 + rnd() * 220, y: 20 + rnd() * 260, big: i % 6 === 0 });
  const fruit = []; for (let k = 0; k < 6; k++) fruit.push({ k, x: 25 + k * 38, y: 200 + (k & 1) * 16, h: k % 3 });
  const shots = []; for (let i = 0; i < 48; i++) shots.push({ x: 92 + (i % 8) * 8, y: 270 - (i >> 3) * 34, who: i & 1, ang: -Math.PI / 2 + ((i % 4) - 1.5) * 0.1, k: i % 12 === 0 ? 'b' : 'p' });
  const fxk = ['pop', 'unwind', 'spark', 'sparkle', 'sticker', 'pop', 'spark', 'heart', 'calm', 'basket', 'seedburst', 'boinged', 'ripen', 'pop', 'spark', 'sparkle', 'sticker', 'pop', 'grab', 'confetti'];
  const fx = fxk.map((k, i) => ({ k, x: 20 + rnd() * 200, y: 40 + rnd() * 220, s: k === 'sticker' ? '+300' : k === 'unwind' ? 'tinbot' : undefined, age: (i * 3) % 20 }));
  return { enemies, bullets, fruit, shots, fx, ships: [{ who: 0, x: 90, y: 280, shield: 2, charge: 40 }, { who: 1, x: 150, y: 284, charge: 60, tilt: .6 }],
    buddies: [{ who: 0, x: 76, y: 286 }, { who: 0, x: 104, y: 286 }, { who: 1, x: 136, y: 290 }, { who: 1, x: 164, y: 290 }],
    hud: { score: 123450, basket: 7, p: [{ name: 'SPRIG', who: 0, hp: 4, shield: 2, buddies: 2, spd: 1, spread: 2, charge: 40 }, { name: 'MARIGOLD', who: 1, hp: 3, shield: 0, buddies: 2, spd: 0, spread: 1, charge: 60, joined: true }], boss: null, net: 'rtc 42 ms', hint: null } };
}

function render() {
  const t0 = performance.now();
  A.rescale(R); A.setStage(0); if (A.flush) A.flush();
  document.querySelectorAll('header button[data-r]').forEach(b => b.classList.toggle('on', +b.dataset.r === R));
  section('heroes', 'Heroes, buddies, shots, bullets', 470, 196, '#cfeeff', ctx => {
    for (let who = 0; who < 2; who++) for (let f = 0; f < 4; f++) { A.ship(ctx, who, 24 + f * 30 + who * 130, 26, { t: f * 5 }); label(ctx, (who ? 'Marigold' : 'Sprig') + ' f' + f, 24 + f * 30 + who * 130, 44); }
    const st = [['tilt -1', { tilt: -1 }], ['tilt 1', { tilt: 1 }], ['shield 3', { shield: 3 }], ['shield 2', { shield: 2 }], ['shield 1', { shield: 1 }], ['charge 30', { charge: 30 }], ['charge 60', { charge: 60 }], ['down', { down: 1 }], ['ghost', { ghost: 1 }], ['blink on', { blink: 1, t: 0 }]];
    for (let who = 0; who < 2; who++) st.forEach(([n, o], i) => { const x = 22 + i * 44, y = 84 + who * 52; A.ship(ctx, who, x, y, Object.assign({ t: 3 }, o)); label(ctx, n, x, y + 20); });
    let x = 20; const y = 176;
    for (let who = 0; who < 2; who++) for (let f = 0; f < 2; f++) { A.buddy(ctx, who, x, y, f * 8); label(ctx, 'buddy' + who, x, y + 10); x += 24; }
    for (const [k, who] of [['p', 0], ['p', 1], ['b', 0], ['seedlet', 0], ['sun', 0]]) { A.shot(ctx, k, x, y - 6, -Math.PI / 2, 4, who); label(ctx, k + (k === 'p' ? who : ''), x, y + 10); x += k === 'sun' ? 34 : 22; }
    A.shot(ctx, 'p', x, y, -Math.PI / 2 - .35, 0, 0); label(ctx, 'angled', x, y + 10); x += 26;
    for (const big of [0, 1]) for (const f of [0, 8]) { A.bullet(ctx, x, y, big, f); label(ctx, big ? 'big' : 'bullet', x, y + 10); x += 22; }
  });
  section('v2', 'v2: pickups (starfruit, 4 seed packets, shield bubble) at t 0/20/40/80, weapon shots, SUPER ship glow', 520, 310, '#bfe6c4', ctx => {
    const names = ['starfruit', 'pea packet', 'petal packet', 'sun packet', 'seeker packet', 'bubble'];
    for (let k = 7; k < 13; k++) [0, 20, 40, 80].forEach((t, i) => { const x = 26 + (k - 7) * 82 + (i & 1) * 36, y = 30 + (i >> 1) * 46; A.fruit(ctx, k, x, y, { t, h: 0 }); if (!i) label(ctx, names[k - 7], x + 18, y + 18 + 46); });
    let x = 18; const y = 150;
    for (const [k, who, ang, t] of [['pbig', 0], ['pbig', 1], ['petal', 0], ['petal', 0, -Math.PI / 2 - .5, 7], ['beam', 0], ['beam', 0, -Math.PI / 2 + .3], ['seeker', 0], ['seeker', 0, -Math.PI / 2 + .9], ['seeker', 0, 0.4], ['p', 0], ['p', 1], ['b', 0]]) { A.shot(ctx, k, x, y, ang == null ? -Math.PI / 2 : ang, t || 4, who); label(ctx, k + (k === 'pbig' || k === 'p' ? who : ''), x, y + 16); x += 26; }
    for (let i = 0; i < 9; i++) { const ang = -Math.PI / 2 + (i - 4) * (60 / 8) * Math.PI / 180; A.shot(ctx, 'star', 330 + i * 20, y, ang, i * 3, 0); } label(ctx, 'super star 9-way spread (rainbow, spinning)', 410, y + 16);
    for (let who = 0; who < 2; who++) [[1, 'super 1'], [.5, 'super .5'], [.15, 'super .15 (blinks)'], [.15, 'blink off frame']].forEach(([su, n], i) => { const sx = 40 + i * 70 + who * 280 * 0, sy = 214 + who * 56; A.ship(ctx, who, sx, sy, { t: i === 3 ? 4 : 0, super: su, shield: i === 1 ? 2 : 0 }); label(ctx, n, sx, sy + 22); });
    for (let wt = 0; wt < 4; wt++) { ctx.fillStyle = 'rgba(43,33,64,.38)'; ctx.beginPath(); ctx.arc(330 + wt * 34, 214, 12, 0, 7); ctx.fill(); A.shot(ctx, ['pbig', 'petal', 'beam', 'seeker'][wt], 330 + wt * 34, 214, -Math.PI / 2, 0, 0); label(ctx, BB.C.WEAPON.names[wt], 330 + wt * 34, 230); }
    label(ctx, 'Sprig / Marigold with SUPER STAR glow', 140, 300);
  });
  section('v2fx', 'v2 fx: super (starfruit grabbed), weapon n0-3 (packet grabbed), bubblepop, at ages 0, 4, 10, 18, 28', 420, 330, '#8fc4a0', ctx => {
    const fxs = [['super', {}], ['weapon', { n: 0 }], ['weapon', { n: 1 }], ['weapon', { n: 2 }], ['weapon', { n: 3 }], ['bubblepop', {}]], ages = [0, 4, 10, 18, 28];
    fxs.forEach(([k, o], r) => { const y = 30 + r * 50; label(ctx, k + (o.n != null ? ' ' + o.n : ''), 30, y - 4);
      ages.forEach((age, i) => { const x = 100 + i * 70; ctx.save(); ctx.beginPath(); ctx.rect(x - 35, y - 25, 70, 50); ctx.clip(); A.fx(ctx, Object.assign({ k, x, y }, o), age); ctx.restore(); if (!r) label(ctx, 'age ' + age, x, 2); }); });
  });
  section('hud', 'v2 HUD pills: 5 hearts (MEDIUM/HARD) and 8 hearts (EASY), weapon icon + power 0-4 per type, SUPER bar, difficulty label', 500, 250, '#7fa8c8', ctx => {
    const P = (o, x, y) => { ctx.save(); ctx.translate(x, y); A.hud(ctx, Object.assign({ t: 6, score: 0, basket: 0 }, o)); ctx.restore(); };
    const base = { name: 'SPRIG', who: 0, hp: 5, hpMax: 5, shield: 1, buddies: 1, spd: 1, spread: 2, wt: 0, charge: 0 };
    const rows = [
      [{ hp: 5 }, { hp: 3, who: 1, name: 'MARIGOLD', wt: 1, spread: 4 }],
      [{ hp: 8, hpMax: 8 }, { hp: 5, hpMax: 8, who: 1, name: 'MARIGOLD', wt: 2, spread: 3 }],
      [{ hp: 7, hpMax: 8, wt: 3, spread: 1, charge: 40 }, { hp: 2, hpMax: 8, who: 1, name: 'MARIGOLD', wt: 0, spread: 0 }],
      [{ hp: 4, super: .9, wt: 2, spread: 4 }, { hp: 6, hpMax: 8, who: 1, name: 'MARIGOLD', super: .35, wt: 3, spread: 2 }],
      [{ hp: 1, wt: 1, spread: 0, super: .12 }, { hp: 0, hpMax: 8, down: 1, who: 1, name: 'MARIGOLD' }],
      [{ hp: 3, hpMax: 6, wt: 0, spread: 4 }, { hp: 7, hpMax: 7, who: 1, name: 'MARIGOLD', wt: 1, spread: 1 }]];
    const diffs = ['MEDIUM', 'EASY', 'EASY', 'HARD', 'EASY', 'EASY'];
    rows.forEach((r, i) => { const y = 4 + i * 40, x = 4 + 0; ctx.fillStyle = '#9fd9a0'; ctx.fillRect(x, y, 240, 38);
      P({ diff: diffs[i], score: 12340 * (i + 1), basket: i, p: r.map(o => Object.assign({}, base, o, { joined: true })) }, x, y); label(ctx, JSON.stringify(r.map(o => [o.hp + '/' + (o.hpMax || 5), 'wt' + (o.wt == null ? 0 : o.wt), 'p' + (o.spread == null ? 2 : o.spread)])).replace(/"/g, ''), 370, y + 12); });
  });
  section('wgrid', 'Weapon icon + power pips: rows pea / petal / sunbeam / seekers, power 0 to 4', 500, 136, '#9fd9a0', ctx => {
    for (let wt = 0; wt < 4; wt++) for (let pw = 0; pw < 5; pw++) { const x = 2 + pw * 99, y = 2 + wt * 33; ctx.save(); ctx.beginPath(); ctx.rect(x, y, 97, 31); ctx.clip(); ctx.translate(x - 2, y - 2);
      A.hud(ctx, { t: 0, touch: true, p: [{ name: BB.C.WEAPON.names[wt], who: 0, hp: 5, hpMax: 5, shield: 0, buddies: 0, spd: 0, spread: pw, wt }] }); ctx.restore(); }
  });
  section('fruit', 'Fruit (no faces): k 0-6 with ring h 0/1/2, squash; berry bush; gift box', 470, 150, '#bfe6c4', ctx => {
    for (let k = 0; k < 7; k++) for (let h = 0; h < 3; h++) { const x = 22 + k * 60 + h * 0, y = 22 + h * 40; if (k >= 5 && h) continue; A.fruit(ctx, k, x + (h ? 0 : 0), y, { t: 10, h }); label(ctx, BB.FRUITS[k].id + ' h' + h, x, y + 14); }
    A.fruit(ctx, 0, 330, 102, { t: 0, h: 1, squash: 1 }); label(ctx, 'squash 1', 330, 116);
    A.fruit(ctx, 6, 370, 102, { t: 4 }); label(ctx, 'rainbow t4', 370, 116);
    A.enemy(ctx, 'bush', 410, 40, { t: 0 }); label(ctx, 'berry bush', 410, 62); A.enemy(ctx, 'bush', 450, 40, { t: 1, flash: 2 }); label(ctx, 'flash', 450, 62);
    A.enemy(ctx, 'present', 410, 100, { t: 0 }); label(ctx, 'gift box', 410, 114); A.enemy(ctx, 'present', 450, 100, { t: 2, flash: 1 }); label(ctx, 'flash', 450, 114);
  });
  const types = ['smudge', 'glider', 'tinbot', 'grumble', 'grumblet', 'twirlie', 'boinger', 'vent', 'ticktock'];
  section('enemies', 'Enemies: a = 0 idle (frames), 1 telegraph, 2 alt, 3 happy/defeated, flash', 470, 40 + types.length * 40, '#d8f3ff', ctx => {
    types.forEach((type, r) => { const y = 24 + r * 40; label(ctx, type, 22, y - 3);
      const cols = [[0, 0], [0, 8], [0, 16], [0, 24], [1, 0], [1, 4], [2, 2], [3, 0], ['F', 0]];
      cols.forEach(([a, t], i) => { const x = 70 + i * 46; if (a === 'F') A.enemy(ctx, type, x, y, { a: 0, t, flash: 2 }); else A.enemy(ctx, type, x, y, { a, t, hpf: 1 }); if (!r) label(ctx, a === 'F' ? 'flash' : 'a' + a + ' t' + t, x, 2); });
    });
  });
  section('bosses', 'Bosses: idle, a1 attack, GRUMP < 50% (v1), < 25% (v2), defeated (a3), hit cue (squash + twinkle, never a white flash)', 800, 440, '#e6d4ff', ctx => {
    const B = [['clanky', 52, 60], ['thunderpuff', 196, 50], ['smoggins', 330, 60]];
    B.forEach(([type, y0, t], r) => { const cols = [{ a: 0, hpf: 1 }, { a: 1, hpf: 1 }, { a: 2, hpf: .4 }, { a: 0, hpf: .2 }, { a: 3, hpf: 0 }, { a: 0, hpf: 1, flash: 2 }];
      cols.forEach((o, i) => { const x = 66 + i * 130; A.enemy(ctx, type, x, y0 + r * 0, Object.assign({ t }, o)); label(ctx, type + ' a' + o.a + ' hpf ' + o.hpf + (o.flash ? ' flash' : ''), x, y0 + 52); }); });
    A.enemy(ctx, 'zap', 790 - 30, 0, { a: 1, t: 10 });
  });
  const fxk = [['pop', {}], ['pop n2', { k: 'pop', n: 2 }], ['unwind', { s: 'tinbot' }], ['calm', {}], ['sparkle', {}], ['spark', {}], ['sticker', { s: 'TEAM TOSS!' }], ['sticker', { s: '+300' }], ['heart', {}], ['heart gift', { k: 'heart', x2: 300, y2: -10 }], ['pot', {}], ['rainbow', {}], ['zapwarn', {}], ['zaplive', {}], ['seedburst', { n: 2 }], ['basket', {}], ['boinged', {}], ['ripen', {}], ['grab', {}], ['revive', {}], ['shield', {}], ['confetti', {}], ['zz', {}]];
  const ages = [0, 3, 8, 14, 22, 34, 50];
  section('fx', 'Effects at ages ' + ages.join(', '), 520, 30 + fxk.length * 46, '#8fc4a0', ctx => {
    fxk.forEach(([name, o], r) => { const y = 32 + r * 46; label(ctx, name, 26, y - 4);
      ages.forEach((age, i) => { const x = 86 + i * 62; ctx.save(); ctx.beginPath(); ctx.rect(x - 31, y - 23, 62, 46); ctx.clip(); if (name === 'rainbow') { ctx.translate(x, y); ctx.scale(.22, .22); ctx.translate(-x, -y); }
        const f = Object.assign({ k: name.split(' ')[0], x, y: y + (name === 'unwind' || name === 'calm' ? 10 : 0) }, o); if (f.x2 != null) { f.x2 = x + 24; f.y2 = y - 10; f.x = x - 20; f.y = y + 10; } if (name === 'rainbow') f.y = y - 60;
        A.fx(ctx, f, age * (name === 'rainbow' ? 3 : 1)); ctx.restore(); if (!r) label(ctx, 'age ' + age, x, 2); }); });
  });
  section('panels', 'In-game frames + HUD, and every screen (240×320 each); v2: titles MEDIUM / online host HARD / online guest / EASY music off / HARD touch sound off, and two v2 frames', 1000, 1976, '#2b2140', ctx => {
    const P = [];
    P.push(c => { A.setStage(0); const o = busy(0); o.hud.p = [o.hud.p[0]]; o.hud.hint = 'Shoot the fruit to change it ↻'; o.hud.net = null; o.ships = [o.ships[0]]; o.buddies = o.buddies.slice(0, 2); scene(c, 0, 400, o); });
    P.push(c => { A.setStage(1); const o = busy(1); o.enemies = o.enemies.slice(10); o.enemies.push({ type: 'thunderpuff', x: 120, y: 80, hpf: .45, a: 1, boss: 1 }, { type: 'zap', x: 60, a: 1 }, { type: 'zap', x: 180, a: 2 }); o.hud.boss = { name: 'Thunderpuff', hpf: .45 }; o.fx = [{ k: 'zapwarn', x: 90, y: 280, age: 4 }]; scene(c, 1, 900, o); });
    P.push(c => { A.setStage(2); const o = busy(2); o.enemies = o.enemies.slice(8); o.enemies.push({ type: 'smoggins', x: 120, y: 74, hpf: .2, boss: 1 }); o.hud.boss = { name: 'Old Smoggins', hpf: .2 }; o.ships[0].down = 1; o.ships[0].y = 200; o.hud.p[0].down = 1; o.hud.p[0].hp = 0; scene(c, 2, 1300, o); });
    P.push(c => { A.setStage(0); const o = busy(0); o.enemies = o.enemies.slice(12); o.enemies.push({ type: 'clanky', x: 120, y: 72, hpf: .7, a: 1, boss: 1 }); o.hud.boss = { name: 'Big Clanky', hpf: .7 }; o.hud.touch = true; o.hud.p = [o.hud.p[0]]; o.ships = [o.ships[0]]; scene(c, 0, 1600, o); });
    P.push(c => { A.setStage(1); scene(c, 1, 300, { calm: 1, fx: [{ k: 'rainbow', x: 120, y: 120, age: 80 }], enemies: [{ type: 'thunderpuff', x: 120, y: 80, a: 3, hpf: 0, boss: 1 }] }); });
    P.push(c => { A.setStage(2); scene(c, 2, 500, { calm: 1 }); });
    P.push(c => A.screen(c, 'title', { t: 30, best: 1, diff: 1, sound: true, music: true }));   // MEDIUM, sound + music on
    P.push(c => { A.screen(c, 'title', { t: 90, best: 2, online: 1, opp: 'Lou', diff: 2, sound: true, music: false }); A.text(c, '2', 120, 116, 24, '#ffd93b'); });   // online host picks (HARD), countdown
    P.push(c => { A.bg(c, 0, 0, 0, {}); A.screen(c, 'banner', { stage: 0, name: 'Patchwork Meadows', age: 40 }); });
    P.push(c => { A.bg(c, 1, 0, 0, {}); A.screen(c, 'warning', { name: 'Thunderpuff', age: 10 }); });
    P.push(c => { A.bg(c, 0, 0, 0, {}); A.screen(c, 'tally', { rows: [['Boss bonus', 5000], ['Hearts left', 1500], ['Fruit grabbed', 12], ['Toys cheered up', 41], ['Bubbles', 1]], stars: 3, age: 260 }); });
    P.push(c => A.screen(c, 'ending', { age: 60, score: 234560 }));
    P.push(c => { A.bg(c, 2, 0, 0, {}); A.screen(c, 'pause', {}); });
    P.push(c => { A.bg(c, 1, 0, 0, {}); A.screen(c, 'wait', { text: 'Lou lost the connection\nWaiting for Lou…\nSPACE: fly on alone' }); });
    P.push(c => A.screen(c, 'upright', { t: 40 }));
    P.push(c => { A.setStage(0); const o = busy(0); o.enemies = o.enemies.slice(12); o.hud.p[0].local = o.hud.p[1].local = true; o.hud.net = null; o.hud.under = [true, false]; o.hud.t = 1e5; scene(c, 0, 700, o); });   // local co-op keys + faded pill
