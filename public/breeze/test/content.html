<script id="sim">
'use strict';
/* Headless content harness (v2): the real World + content, fake ships (dodge / power / wander / still bots), column auto-fire

   / HARD, solo and co-op. Works with the v1 world too: when the world ignores o.diff, the harness sets w.diff itself and applies

(function () {
const C = BB.C, SH = C.SHIP, DIFF = C.DIFF || [{ name: 'MEDIUM', hp: 5, reviveHp: 3, bMul: 1, eHp: 1, extra: 0 }];
const H = {};

const kinds = o => Object.keys(o).sort((a, b) => a - b).map(k => (KN[k] || k) + ' ' + o[k]).join(', ') || '-';
function mkShip(who, x, mode, df) {

}
/* player shots: pea weapon at power pw (SHIP.spreadDeg[pw]: 0 = the twin shot), 6 px/t, stop on the first shootable thing */
function shotsStep(w, R) {
  for (const p of R.shots) {
    p.x += p.vx; p.y += p.vy;
    for (const e of w.enemies) {
      const d = BB.ENEMY[e.type]; if (e.dead || e.dying || !d.shootable || e.y < 4) continue;
      const rr = e.r + SH.shotR; if ((e.x - p.x) ** 2 + (e.y - p.y) ** 2 < rr * rr) { p.gone = true; if (e.hp >= 0 && w.damage(e, p.dmg, p.who)) R.kills++; break; }
    }

function volley(s, R) {

  for (const deg of a) {
    const r = deg * Math.PI / 180, vx = Math.sin(r) * SH.shotV, vy = -Math.cos(r) * SH.shotV;
    if (deg === 0) for (const k of [-1, 1]) R.shots.push({ x: s.x + k * SH.shotDx, y: s.y - 10, vx, vy, dmg, who: s.who });

function bot(w, s) {

    if (!s.goal || Math.hypot(s.goal[0] - s.x, s.goal[1] - s.y) < 4) s.goal = [20 + s.rnd() * 200, 220 + s.rnd() * 80];
    const dx = s.goal[0] - s.x, dy = s.goal[1] - s.y, m = Math.hypot(dx, dy) || 1, v = SH.speeds[0] * 0.7;

    const px = b.x + b.vx * 12, py = b.y + b.vy * 12, dx = s.x - px, dy = s.y - py, d2 = dx * dx + dy * dy;
    if (d2 < 48 * 48) { const k = 260 / (d2 + 30); fx += dx * k; fy += dy * k; }
  }

  if (!t) for (const e of w.enemies) { const d = BB.ENEMY[e.type]; if (!d.shootable || e.y < 0 || e.y > s.y - 30 || e.dying) continue; const dd = Math.abs(e.x - s.x); if (dd < td) { td = dd; t = e; } }

function shipStep(w, s, R) {

  for (const f of w.fruits) if (!f.taken && (f.x - s.x) ** 2 + (f.y - s.y) ** 2 < SH.pickR ** 2) {
    f.taken = true; R.grabbed[f.k] = (R.grabbed[f.k] | 0) + 1;
    if (s.mode === 'power' && (f.k === 3 || (f.k >= 8 && f.k <= 11))) s.pw = Math.min(SH.powerMax || 2, s.pw + 1);
    if (f.k === 12) s.shield = Math.min(3, s.shield + 1); else if (f.k === 1 || f.k === 6) s.shield = 3;

  for (const e of w.enemies) {
    const d = BB.ENEMY[e.type]; if (e.dead || !d.contact) continue;
    const dx = s.x - e.x, dy = s.y - e.y, rr = e.r + SH.hurtR;
    if (dx * dx + dy * dy < rr * rr) {
      const m = Math.hypot(dx, dy) || 1;
      if (d.boss) { s.x = e.x + dx / m * (e.r + 8); s.y = e.y + dy / m * (e.r + 8); }
      else if (s.inv <= 0) { w.damage(e, SH.bonkDmg, s.who); s.x += dx / m * 12; s.y += dy / m * 12; s.inv = SH.invBonk; s.bonks++; }
    }

  if (s.inv > 0) return;
  let hit = false;
  for (const b of w.bullets) if (!b.dead && (b.x - s.x) ** 2 + (b.y - s.y) ** 2 < (SH.hurtR + b.r) ** 2) { b.dead = true; hit = true; break; }
  if (!hit) for (const e of w.enemies) { const d = BB.ENEMY[e.type]; if (d.hit && d.hit(e, s.x, s.y)) { hit = true; R.zapHits++; break; } }
  if (!hit) return;
  s.hits++; s.inv = SH.invHit;

/* the v1 world has no difficulty: set w.diff and apply DIFF.bMul / DIFF.eHp here the way the v2 world does */
function withDiff(o, df) {

  if (w.diff === df) return w;
  w.diff = df; w.emulated = true;
  const D = DIFF[df] || DIFF[1], bu = w.bullet.bind(w), sp = w.spawn.bind(w);
  if (D.bMul !== 1) w.bullet = (x, y, s, a, big) => bu(x, y, s * D.bMul, a, big);

}
function instrument(w, R) {

  w.spawn = function (type, x, y, init) {
    const def = BB.ENEMY[type];
    if (type === 'bush' && w.count('bush') >= C.MAX_BUSH) R.cap.bush++;
    const e = sp.call(w, type, x, y, init);

    return e;

    if (w.bullets.length >= C.MAX_EBUL) { R.cap.bullet++; return false; }
    const ok = bu.call(w, x, y, s, a, big);
    if (ok) { R.fired++; if (R.phase === 'timeline') R.byType[R.cur] = (R.byType[R.cur] | 0) + 1; const k = R.phase === 'boss' && w.boss ? 'boss' + ((w.boss.d && w.boss.d.ph) | 0) : R.phase; R.firedPh[k] = (R.firedPh[k] | 0) + 1; } else R.safeRej++;
    return ok;

function step(w, R) {

const newR = (st, df, modes) => ({ stage: st, df, modes: modes.join('+'), spawned: {}, peakE: 0, peakB: 0, fired: 0, firedPh: {}, phTicks: {}, safeRej: 0, cap: { bullet: 0, enemy: 0, bush: 0 },

/* explicit boss checks: damage to 0 → bossDone(false); tired → bossDone(true); 3 phases reached; last-phase cough */

/* zap check: Thunderpuff zap columns per player */

function defsCheck() {

    for (const k of ['ground', 'boss', 'shootable', 'contact']) if (typeof d[k] !== 'boolean') bad.push(t + ': ' + k);
    if (typeof d.tick !== 'function') bad.push(t + ': tick');

const MODES = [['still'], ['wander'], ['dodge'], ['power'], ['wander', 'wander'], ['dodge', 'dodge']];

    `    boss hp ${R.bossHp}: ${R.bossBeaten ? 'cheered up in ' + (R.bossTicks / 60).toFixed(1) + ' s' : 'TIRED (90 s)'} · bossDone ${R.bossDone.length === 1 ? (R.bossDone[0].tired ? 'tired' : 'ok') : JSON.stringify(R.bossDone)} · kills ${R.kills} · formations cleared ${R.cleared}${R.modes === 'power' ? ' · end power ' + R.pw.join(',') : ''} · exceptions ${R.exc.length}${R.exc.length ? ' ' + R.exc[0] : ''}\n` +
    `    timeline bullets by shooter: ${Object.entries(R.byType).sort((a, b) => b[1] - a[1]).map(([k, v]) => k + ' ' + v).join(', ')}\n` +

/* compact summary table: one line per stage x difficulty (solo bots) */
function summary(rows) {

  for (let st = 0; st < 3; st++) for (let df = 0; df < 3; df++) {
    const g = m => rows.find(r => r.stage === st && r.df === df && r.modes === m); const d = g('dodge'), s = g('still'), wa = g('wander'), p = g('power'), co = g('dodge+dodge');

H.runAll = function (seed, diffs) {

  lines.push('definition check: ' + (data.defs.length ? 'PROBLEMS ' + data.defs.join('; ') : 'ok (' + BB.TYPE_LIST.length + ' types, ' + BB.STAGES.map(S => S.waves.length).join('/') + ' waves)'));

/* averages over several seeds (one seed is noisy): per stage x difficulty, solo still / wander / dodge bots */
H.avg = function (seeds, diffs) {

    lines.push(`S${st + 1} ${(DIFF[df].name + '      ').slice(0, 6)} ${f(m(d.map(r => r.enemiesTimeline)))} | ${f(m(d.map(r => r.perMinTimeline)))} / ${f(m(R.still.map(r => r.perMinTimeline)))} | ${f(m(d.map(r => r.perMinBoss)))} (${ph.join('/')}) | ${f(m(d.map(r => r.bossTicks / 60)))} (${d.filter(r => !r.bossBeaten).length}) | ${f(m(R.wander.map(r => r.hits[0])))} / ${f(m(d.map(r => r.hits[0])))} | ${f(m(R.wander.map(r => r.lost[0])))} | ${f(m(d.map(good)))}`);

H.runStage = runStage; H.bossChecks = bossChecks; H.v2Checks = v2Checks;
/* visual: run a stage with bots to `sec`, draw with whatever BB.Art exists, post to /__shot */
H.snapshot = async function (st, sec, n, name, cv, mode, df) {
