   drops by kind (summed), and the human-like bot (RT-tick reaction, no upgrades): hits, hearts lost (timeline + boss), downs,
   lives lost, game overs, boss time. 'humanp' (grabs about half of the power pickups, capped) in the last columns. */
H.human = function (seeds, diffs) {
  seeds = seeds || [1, 2, 3, 4, 5, 6];
  const m = a => a.reduce((x, y) => x + y, 0) / a.length, f = v => (Math.round(v * 10) / 10).toString(), rows = [], data = [];
  rows.push(`HUMAN BOT (reaction ${RT} ticks) over seeds ${seeds.join(',')}, solo, each stage from full hearts${safeEmu() ? ' · safeR emulated (world has no DIFF.safeR yet)' : ''}`);
  rows.push('stage diff   | bullets/min tl / boss | peak b | human: hits tl+boss | hearts lost tl+boss | downs | lives lost | game over | boss s (tired) | humanp: hearts lost | end power | drops (all seeds, human runs)');
  for (let st = 0; st < 3; st++) for (const df of diffs || [0, 1, 2]) {
    const A = seeds.map(sd => runStage(st, ['human'], sd, df)), P = seeds.map(sd => runStage(st, ['humanp'], sd, df)), dr = {};
    for (const r of A) for (const k in r.fruit) dr[k] = (dr[k] | 0) + r.fruit[k];
    const lt = r => r.lostAt.filter(t => t <= BB.STAGES[st].bossAt * 60 + C.STAGE.warnTicks).length;
    const row = { st, df, perMin: m(A.map(r => r.perMinTimeline)), boss: m(A.map(r => r.perMinBoss)), peakB: Math.max(...A.map(r => r.peakB)), hits: m(A.map(r => r.hits[0])), hitsTl: m(A.map(r => r.hitsTimeline[0])),
      lostTl: m(A.map(lt)), lost: m(A.map(r => r.lost[0])), downs: m(A.map(r => r.bubbles[0])), livesLost: m(A.map(r => r.livesLost)), over: A.filter(r => r.gameOver).length,
      hitBy: A.reduce((o, r) => { for (const k in r.hitBy) o[k] = (o[k] | 0) + r.hitBy[k]; return o; }, {}),
      bossS: m(A.map(r => r.bossTicks / 60)), tired: A.filter(r => !r.bossBeaten).length, lostP: m(P.map(r => r.lost[0])), pw: m(P.map(r => r.pw[0])), drops: dr, star: dr[7] | 0 };
    data.push(row);
    rows.push(`S${st + 1} ${(DIFF[df].name + '      ').slice(0, 6)} | ${f(row.perMin).padStart(5)} / ${f(row.boss).padStart(5)} | ${String(row.peakB).padStart(2)}/${C.MAX_EBUL} | ${f(row.hitsTl)}+${f(row.hits - row.hitsTl)} | ${f(row.lostTl)}+${f(row.lost - row.lostTl)} = ${f(row.lost)} | ${f(row.downs)} | ${f(row.livesLost)} | ${row.over}/${seeds.length} | ${f(row.bossS)} (${row.tired}) | ${f(row.lostP)} | ${f(row.pw)} | ${kinds(dr)}`);
  }
  rows.push('hits by shooter (all seeds; "<rt" = the bullet was younger than the reaction delay):');
  for (const r of data) if (r.df === 2 || r.hits > 1) rows.push(`  S${r.st + 1} ${DIFF[r.df].name}: ` + Object.entries(r.hitBy).sort((a, b) => b[1] - a[1]).map(([k, v]) => k + ' ' + v).join(', '));
  const s1 = data.filter(r => r.st === 0).reduce((n, r) => n + r.star, 0);
  rows.push(`starfruit dropped in stage 1 (all difficulties, all seeds): ${s1}${s1 ? '  PROBLEM' : ' (ok)'}`);
  return { text: rows.join('\n'), data, star1: s1 };
};
/* a whole run (stages 1 → 3, hearts and lives carried, +DIFF.heal at each stage start) with the human bot: where does it end? */
H.campaign = function (seeds, diffs, mode) {
  seeds = seeds || [1, 2, 3, 4, 5, 6, 7, 8]; mode = mode || 'human';
  const rows = [`RUN (${mode} bot, stages 1-3 carried, seeds ${seeds.join(',')}): hearts lost per stage (avg) | lives lost per stage | GAME OVER: count and the stage each ended`], data = [];
  for (const df of diffs || [0, 1, 2]) {
    const per = [[], [], []], lv = [[], [], []], ends = [], hb = [{}, {}, {}], pw = [[], [], []];
    for (const sd of seeds) {
      let carry = null, end = 'clear';
      for (let st = 0; st < 3; st++) {
        const R = runStage(st, [mode], sd, df, carry);
        per[st].push(R.lost[0]); lv[st].push(R.livesLost); pw[st].push(R.pw[0]); for (const k in R.hitBy) hb[st][k] = (hb[st][k] | 0) + R.hitBy[k];
        if (R.gameOver) { end = 'S' + (st + 1) + (R.overAt > BB.STAGES[st].bossAt * 60 ? ' boss' : ''); break; }
        carry = { ships: R.ships, lives: R.lives };
      }
      ends.push(end);
    }
    const av = a => a.length ? (Math.round(a.reduce((x, y) => x + y, 0) / a.length * 10) / 10) + (a.length < seeds.length ? '(n' + a.length + ')' : '') : '-';
    const go = ends.filter(e => e !== 'clear').length;
    data.push({ df, hearts: per.map(av), lives: lv.map(av), over: go, ends });
    rows.push(`${(DIFF[df].name + '      ').slice(0, 6)} hearts ${per.map(av).join(' / ')} | lives ${lv.map(av).join(' / ')} | GAME OVER ${go}/${seeds.length}: ${ends.join(' ')}${mode === 'humanp' ? ' | power at stage end ' + pw.map(av).join(' / ') : ''}`);
    if (df === 2) rows.push('  hits by: ' + hb.map((o, i) => 'S' + (i + 1) + ' ' + Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([k, v]) => k + ' ' + v).join(', ')).join(' | '));
  }
  return { text: rows.join('\n'), data };
};
H.runStage = runStage; H.bossChecks = bossChecks; H.v2Checks = v2Checks;
/* visual: run a stage with bots to `sec`, draw with whatever BB.Art exists, post to /__shot */
H.snapshot = async function (st, sec, n, name, cv, mode, df) {
  df = df == null ? 1 : df;
  const w = withDiff({ stage: st, seed: 7, coop: n > 1 }, df), R = newR(st, df, [mode || 'watch']);
  instrument(w, R);
  const ships = []; for (let i = 0; i < n; i++) ships.push(mkShip(i, n > 1 ? (i ? 150 : 90) : 120, mode || 'watch', df));
  w.ships.push(...ships); w.onStep = () => { for (const s of ships) shipStep(w, s, R); shotsStep(w, R); };
  const S = BB.STAGES[st], unSafe = setSafe(df);
  if (typeof sec === 'string' && sec.indexOf('boss') === 0) { while (w.tick < S.bossAt * 60) step(w, R); w.ph = 2; R.phase = 'boss'; const b = w.spawn(S.boss, 120, -40); for (let i = 0; i < 400; i++) step(w, R); const f = { boss: 0.9, boss2: 0.5, boss3: 0.2 }[sec]; b.hp = Math.round(b.maxHp * f); for (let i = 0; i < 300; i++) step(w, R); }
  else while (w.tick < sec * 60) step(w, R);
  unSafe();
  const ctx = cv.getContext('2d'), A = BB.Art, Rr = cv.width / C.W;
  if (!A.ready && A.init) A.init(Rr); if (A.setStage) A.setStage(st);
  ctx.setTransform(Rr, 0, 0, Rr, 0, 0);
  A.bg(ctx, st, w.tick * C.SCROLL, w.tick, { calm: 0 });
  const draw = e => A.enemy(ctx, e.type, e.x, e.y, { a: e.a, t: e.t, flash: e.flash, hpf: e.hp / e.maxHp });
  for (const e of w.enemies) if (BB.ENEMY[e.type].ground) draw(e);
  for (const e of w.enemies) if (e.type === 'bush') draw(e);
  for (const f of w.fruits) try { A.fruit(ctx, f.k, f.x, f.y, { t: w.tick, h: f.h, next: (f.k + 1) % 5, squash: 0 }); } catch (err) { /* art without the v2 pickups */ }
  for (const e of w.enemies) if (!BB.ENEMY[e.type].ground && e.type !== 'bush') draw(e);
  for (const s of ships) A.ship(ctx, s.who, s.x, s.y, { t: w.tick, blink: s.inv > 0, down: !!s.down, shield: s.shield, charge: 0, tilt: 0 });
  for (const b of w.bullets) A.bullet(ctx, b.x, b.y, b.big, w.tick);
  A.text(ctx, `S${st + 1} ${DIFF[df].name} ${sec}${typeof sec === 'number' ? 's' : ''} e${w.count()} b${w.bullets.length}`, 4, 8, 7, '#222', 'left');
  await new Promise(r => cv.toBlob(b => fetch('/__shot?name=' + name, { method: 'POST', body: b }).then(r, r), 'image/png'));
  return { name, enemies: w.count(), bullets: w.bullets.length };
};
H.visualAll = async function (prefix) {
  const cv = document.getElementById('c'), out = [];
  /* ships 'watch' (never fire, never move) so formations stay whole; bosses are drawn with dodging, firing ships */
  /* v3: mostly HARD (the new content); one MEDIUM per stage for comparison */
  const plan = [[0, 30, 1], [0, 17, 2], [0, 54, 2], [0, 85, 2], [0, 'boss', 2], [0, 'boss2', 2], [0, 'boss3', 2], [1, 62, 1], [1, 9, 2], [1, 49, 2], [1, 92, 2],
    [1, 'boss', 2], [1, 'boss2', 2], [1, 'boss3', 2], [2, 88, 1], [2, 16, 2], [2, 66, 2], [2, 98, 2], [2, 'boss', 2], [2, 'boss2', 2], [2, 'boss3', 2]];
  for (const [st, sec, df] of plan) out.push(await H.snapshot(st, sec, st === 1 ? 2 : 1, `${prefix || 'v3-content'}-s${st + 1}-${sec}-d${df}.png`, cv, typeof sec === 'string' ? 'dodge' : 'watch', df));
  return out;
};
window.BBTest = H;
if (typeof document !== 'undefined' && document.getElementById) {
  const out = document.getElementById('out'), Q = new URLSearchParams(location.search), seed = Q.get('seed') != null ? +Q.get('seed') : undefined;
  const run = () => { out.textContent = 'running…'; setTimeout(() => { const d = H.runAll(seed); window.__report = d; out.textContent = d.text; }, 10); };
  document.getElementById('run').onclick = run;
  document.getElementById('vis').onclick = async () => { out.textContent = JSON.stringify(await H.visualAll(), null, 1); };
  out.textContent = 'ready';
  if (Q.get('run')) run();
  if (Q.get('vis')) H.visualAll().then(r => { window.__vis = r; });
}
})();
